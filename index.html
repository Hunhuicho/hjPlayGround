<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>스네이크 미니게임</title>
<style>
  :root {
    --bg: #10131a;
    --panel: #181d28;
    --grid: #1f2534;
    --snake: #4ade80;
    --snake-head: #86efac;
    --food: #f87171;
    --text: #e5e7eb;
    --muted: #8b93a7;
    --accent: #60a5fa;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 16px;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }

  h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .scoreboard {
    display: flex;
    gap: 24px;
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    color: var(--muted);
  }

  .scoreboard strong {
    color: var(--text);
    font-size: 18px;
    margin-left: 6px;
  }

  .stage {
    position: relative;
    width: min(92vw, 92vh - 160px, 480px);
    aspect-ratio: 1;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    background: var(--panel);
    border-radius: 12px;
    border: 1px solid #262d3d;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(16, 19, 26, 0.82);
    border-radius: 12px;
    text-align: center;
    padding: 20px;
  }

  .overlay[hidden] { display: none; }

  .overlay .title { font-size: 22px; font-weight: 700; }
  .overlay .desc { font-size: 14px; color: var(--muted); line-height: 1.6; }

  button {
    font: inherit;
    font-weight: 600;
    color: #0b1020;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    cursor: pointer;
  }

  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(1px); }

  .hint {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    line-height: 1.6;
  }

  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 56px);
    gap: 8px;
  }

  .dpad button {
    width: 56px;
    height: 56px;
    background: var(--grid);
    color: var(--text);
    font-size: 20px;
    border-radius: 10px;
  }

  .dpad .up   { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 2; }
  .dpad .right{ grid-column: 3; grid-row: 2; }

  @media (hover: hover) and (pointer: fine) {
    .dpad { display: none; }
  }
</style>
</head>
<body>
  <h1>🐍 스네이크</h1>

  <div class="scoreboard">
    <span>점수 <strong id="score">0</strong></span>
    <span>최고 <strong id="best">0</strong></span>
  </div>

  <div class="stage">
    <canvas id="board" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <div class="title" id="overlay-title">시작할 준비되셨나요?</div>
      <div class="desc" id="overlay-desc">방향키 또는 WASD로 움직이세요.<br>먹이를 먹으면 길어집니다.</div>
      <button id="start-btn">게임 시작</button>
    </div>
  </div>

  <p class="hint">방향키 / WASD 이동 · 스페이스바 일시정지 · R 다시 시작</p>

  <div class="dpad">
    <button class="up"    data-dir="up"    aria-label="위">▲</button>
    <button class="left"  data-dir="left"  aria-label="왼쪽">◀</button>
    <button class="down"  data-dir="down"  aria-label="아래">▼</button>
    <button class="right" data-dir="right" aria-label="오른쪽">▶</button>
  </div>

<script>
(function () {
  'use strict';

  var GRID = 20;                 // 20 x 20 칸
  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var CELL = canvas.width / GRID;

  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var overlayTitle = document.getElementById('overlay-title');
  var overlayDesc = document.getElementById('overlay-desc');
  var startBtn = document.getElementById('start-btn');

  var DIRS = {
    up:    { x: 0,  y: -1 },
    down:  { x: 0,  y: 1  },
    left:  { x: -1, y: 0  },
    right: { x: 1,  y: 0  }
  };

  var BEST_KEY = 'snake.best';

  var snake, dir, queuedDir, food, score, best, state, tickMs, accumulator, lastTime;

  best = Number(localStorage.getItem(BEST_KEY) || 0);
  bestEl.textContent = best;

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = DIRS.right;
    queuedDir = null;
    score = 0;
    tickMs = 140;
    accumulator = 0;
    lastTime = 0;
    scoreEl.textContent = '0';
    placeFood();
  }

  function placeFood() {
    var free = [];
    for (var y = 0; y < GRID; y++) {
      for (var x = 0; x < GRID; x++) {
        if (!occupied(x, y)) free.push({ x: x, y: y });
      }
    }
    // 빈 칸이 없으면 판을 가득 채운 것 — 클리어 처리
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function occupied(x, y) {
    for (var i = 0; i < snake.length; i++) {
      if (snake[i].x === x && snake[i].y === y) return true;
    }
    return false;
  }

  function setDirection(name) {
    var next = DIRS[name];
    if (!next) return;
    // 한 틱 안에 반대 방향으로 꺾어 자기 목을 무는 것을 막는다
    var current = queuedDir || dir;
    if (current.x + next.x === 0 && current.y + next.y === 0) return;
    queuedDir = next;
  }

  function step() {
    if (queuedDir) {
      dir = queuedDir;
      queuedDir = null;
    }

    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) return gameOver('벽에 부딪혔어요');

    // 꼬리 끝 칸은 이번 틱에 비워지므로 충돌로 치지 않는다
    var ateFood = food && head.x === food.x && head.y === food.y;
    var limit = ateFood ? snake.length : snake.length - 1;
    for (var i = 0; i < limit; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) return gameOver('자기 몸에 부딪혔어요');
    }

    snake.unshift(head);

    if (ateFood) {
      score += 10;
      scoreEl.textContent = score;
      if (tickMs > 70) tickMs -= 3;   // 먹을수록 조금씩 빨라진다
      placeFood();
      if (!food) return win();
    } else {
      snake.pop();
    }
  }

  function draw() {
    ctx.fillStyle = getVar('--panel');
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 격자
    ctx.strokeStyle = getVar('--grid');
    ctx.lineWidth = 1;
    for (var i = 1; i < GRID; i++) {
      var p = i * CELL + 0.5;
      ctx.beginPath();
      ctx.moveTo(p, 0); ctx.lineTo(p, canvas.height);
      ctx.moveTo(0, p); ctx.lineTo(canvas.width, p);
      ctx.stroke();
    }

    if (food) {
      ctx.fillStyle = getVar('--food');
      roundRect(food.x * CELL + 4, food.y * CELL + 4, CELL - 8, CELL - 8, 4);
      ctx.fill();
    }

    for (var s = snake.length - 1; s >= 0; s--) {
      ctx.fillStyle = s === 0 ? getVar('--snake-head') : getVar('--snake');
      roundRect(snake[s].x * CELL + 1, snake[s].y * CELL + 1, CELL - 2, CELL - 2, 4);
      ctx.fill();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function getVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function loop(time) {
    if (state !== 'playing') return;
    if (!lastTime) lastTime = time;
    accumulator += time - lastTime;
    lastTime = time;

    while (accumulator >= tickMs && state === 'playing') {
      accumulator -= tickMs;
      step();
    }

    draw();
    requestAnimationFrame(loop);
  }

  function saveBest() {
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) { /* 저장 불가 환경 무시 */ }
    }
  }

  function showOverlay(title, desc, buttonLabel) {
    overlayTitle.textContent = title;
    overlayDesc.innerHTML = desc;
    startBtn.textContent = buttonLabel;
    overlay.hidden = false;
  }

  function start() {
    reset();
    state = 'playing';
    overlay.hidden = true;
    lastTime = 0;
    requestAnimationFrame(loop);
  }

  function gameOver(reason) {
    state = 'over';
    saveBest();
    draw();
    showOverlay('게임 오버', reason + '<br>점수: <b>' + score + '</b>', '다시 하기');
  }

  function win() {
    state = 'over';
    saveBest();
    draw();
    showOverlay('클리어! 🎉', '판을 가득 채웠어요.<br>점수: <b>' + score + '</b>', '다시 하기');
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      showOverlay('일시정지', '스페이스바를 누르거나 버튼을 눌러 계속하세요.', '계속하기');
    } else if (state === 'paused') {
      state = 'playing';
      overlay.hidden = true;
      lastTime = 0;
      accumulator = 0;
      requestAnimationFrame(loop);
    }
  }

  var KEYS = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right'
  };

  document.addEventListener('keydown', function (e) {
    if (KEYS[e.key]) {
      e.preventDefault();
      if (state === 'playing') setDirection(KEYS[e.key]);
      return;
    }
    if (e.key === ' ') {
      e.preventDefault();
      if (state === 'playing' || state === 'paused') togglePause();
      else start();
      return;
    }
    if (e.key === 'r' || e.key === 'R') start();
  });

  startBtn.addEventListener('click', function () {
    if (state === 'paused') togglePause();
    else start();
  });

  Array.prototype.forEach.call(document.querySelectorAll('.dpad button'), function (btn) {
    btn.addEventListener('click', function () {
      if (state === 'playing') setDirection(btn.dataset.dir);
    });
  });

  // 스와이프 조작
  var touchStart = null;
  canvas.addEventListener('touchstart', function (e) {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });

  canvas.addEventListener('touchend', function (e) {
    if (!touchStart || state !== 'playing') return;
    var dx = e.changedTouches[0].clientX - touchStart.x;
    var dy = e.changedTouches[0].clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDirection(dx > 0 ? 'right' : 'left');
    else setDirection(dy > 0 ? 'down' : 'up');
  }, { passive: true });

  // 첫 화면
  state = 'ready';
  reset();
  draw();
})();
</script>
</body>
</html>
