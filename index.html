<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>스네이크 — 방향키 미니게임</title>
<style>
  /* 흑백 LCD 휴대용 게임기. 화면 자체가 하나의 사물이므로 단일 테마로 확정하고,
     배경과 모든 색을 명시해 호스트 테마와 무관하게 같은 모습으로 보이게 한다. */
  :root {
    --case:        #1c1d19;
    --case-face:   #33352c;
    --case-edge:   #4a4d40;
    --case-shadow: #121310;
    --case-text:   #9ba08b;   /* 케이스 위 각인 — 어두운 플라스틱에서 4.6:1 */
    --lcd:         #a9b884;
    --lcd-dim:     #9cac77;
    --ink:         #242b1c;
    --ink-soft:    #5c6a49;
    --key:         #26281f;
    --key-face:    #3d4034;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    background: var(--case);
    color: var(--lcd);
    font-family: var(--mono);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }

  .device {
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 22px;
    border-radius: 18px;
    background: var(--case-face);
    border: 1px solid var(--case-edge);
    box-shadow: 0 1px 0 var(--case-edge) inset, 0 18px 40px -18px var(--case-shadow);
  }

  /* ── 케이스 상단 각인 ─────────────────────────── */
  .brand {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--case-text);
  }

  .brand .model { letter-spacing: 0.14em; opacity: 0.7; }

  /* ── LCD 화면 ─────────────────────────────────── */
  .screen {
    padding: 14px;
    border-radius: 6px;
    background: var(--lcd);
    box-shadow: 0 2px 8px var(--case-shadow) inset, 0 0 0 2px var(--case-shadow);
  }

  .readout {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 10px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--lcd-dim);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .readout b {
    margin-left: 8px;
    font-size: 17px;
    letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }

  .stage {
    position: relative;
    width: min(78vw, 62vh, 360px);
    aspect-ratio: 1;
  }

  canvas { width: 100%; height: 100%; display: block; }

  /* ── 화면 위 메시지 ───────────────────────────── */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 18px;
    text-align: center;
    background: rgba(169, 184, 132, 0.93);
    color: var(--ink);
  }

  .overlay[hidden] { display: none; }

  .overlay .title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    text-wrap: balance;
  }

  .overlay .desc {
    font-size: 12.5px;
    line-height: 1.75;
    color: var(--ink-soft);
  }

  .overlay .desc b {
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  /* ── 조작부 ───────────────────────────────────── */
  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: 4px;
  }

  button:focus-visible {
    outline: 2px solid var(--lcd);
    outline-offset: 2px;
  }

  #start-btn {
    margin-top: 2px;
    padding: 9px 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--lcd);
    background: var(--ink);
  }

  #start-btn:hover { background: var(--ink-soft); }
  #start-btn:active { transform: translateY(1px); }

  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }

  .legend {
    margin: 0;
    font-size: 11px;
    line-height: 2;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--case-text);
  }

  .legend b { color: var(--lcd); font-weight: 700; }

  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 40px);
    grid-template-rows: repeat(3, 40px);
    gap: 4px;
    flex: none;
  }

  .dpad button {
    background: var(--key-face);
    color: var(--lcd);
    font-size: 13px;
    line-height: 1;
    box-shadow: 0 2px 0 var(--key);
  }

  .dpad button:active { transform: translateY(2px); box-shadow: none; }

  .dpad .up    { grid-area: 1 / 2; }
  .dpad .left  { grid-area: 2 / 1; }
  .dpad .down  { grid-area: 3 / 2; }
  .dpad .right { grid-area: 2 / 3; }

  @media (prefers-reduced-motion: reduce) {
    button:active { transform: none; }
  }
</style>
</head>
<body>
  <div class="device">
    <div class="brand">
      <span>Snake</span>
      <span class="model">hjPlayGround</span>
    </div>

    <div class="screen">
      <div class="readout">
        <span>Score <b id="score">0</b></span>
        <span>Best <b id="best">0</b></span>
      </div>

      <div class="stage">
        <canvas id="board" width="400" height="400"></canvas>
        <div class="overlay" id="overlay">
          <div class="title" id="overlay-title">Ready</div>
          <div class="desc" id="overlay-desc">방향키로 뱀을 움직여<br>먹이를 먹으세요.</div>
          <button id="start-btn">Start</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <p class="legend">
        <b>← ↑ ↓ →</b> 이동<br>
        <b>Space</b> 일시정지 · <b>R</b> 다시 시작
      </p>
      <div class="dpad">
        <button class="up"    data-dir="up"    aria-label="위쪽으로 이동">▲</button>
        <button class="left"  data-dir="left"  aria-label="왼쪽으로 이동">◀</button>
        <button class="down"  data-dir="down"  aria-label="아래쪽으로 이동">▼</button>
        <button class="right" data-dir="right" aria-label="오른쪽으로 이동">▶</button>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  var GRID = 20;                 // 20 x 20 칸
  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var CELL = canvas.width / GRID;

  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var overlayTitle = document.getElementById('overlay-title');
  var overlayDesc = document.getElementById('overlay-desc');
  var startBtn = document.getElementById('start-btn');

  var DIRS = {
    up:    { x: 0,  y: -1 },
    down:  { x: 0,  y: 1  },
    left:  { x: -1, y: 0  },
    right: { x: 1,  y: 0  }
  };

  var BEST_KEY = 'snake.best';

  // LCD 픽셀 색은 매 프레임 계산하지 않고 한 번만 읽어 둔다
  var COLORS = (function () {
    var s = getComputedStyle(document.documentElement);
    return {
      lcd:  s.getPropertyValue('--lcd').trim(),
      grid: s.getPropertyValue('--lcd-dim').trim(),
      ink:  s.getPropertyValue('--ink').trim(),
      soft: s.getPropertyValue('--ink-soft').trim()
    };
  })();

  var snake, dir, queuedDir, food, score, best, state, tickMs, accumulator, lastTime;

  best = Number(localStorage.getItem(BEST_KEY) || 0);
  bestEl.textContent = best;

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = DIRS.right;
    queuedDir = null;
    score = 0;
    tickMs = 140;
    accumulator = 0;
    lastTime = 0;
    scoreEl.textContent = '0';
    placeFood();
  }

  function placeFood() {
    var free = [];
    for (var y = 0; y < GRID; y++) {
      for (var x = 0; x < GRID; x++) {
        if (!occupied(x, y)) free.push({ x: x, y: y });
      }
    }
    // 빈 칸이 없으면 판을 가득 채운 것 — 클리어 처리
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function occupied(x, y) {
    for (var i = 0; i < snake.length; i++) {
      if (snake[i].x === x && snake[i].y === y) return true;
    }
    return false;
  }

  function setDirection(name) {
    var next = DIRS[name];
    if (!next) return;
    // 한 틱 안에 반대 방향으로 꺾어 자기 목을 무는 것을 막는다
    var current = queuedDir || dir;
    if (current.x + next.x === 0 && current.y + next.y === 0) return;
    queuedDir = next;
  }

  function step() {
    if (queuedDir) {
      dir = queuedDir;
      queuedDir = null;
    }

    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) return gameOver('벽에 부딪혔어요');

    // 꼬리 끝 칸은 이번 틱에 비워지므로 충돌로 치지 않는다
    var ateFood = food && head.x === food.x && head.y === food.y;
    var limit = ateFood ? snake.length : snake.length - 1;
    for (var i = 0; i < limit; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) return gameOver('자기 몸에 부딪혔어요');
    }

    snake.unshift(head);

    if (ateFood) {
      score += 10;
      scoreEl.textContent = score;
      if (tickMs > 70) tickMs -= 3;   // 먹을수록 조금씩 빨라진다
      placeFood();
      if (!food) return win();
    } else {
      snake.pop();
    }
  }

  function draw() {
    ctx.fillStyle = COLORS.lcd;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 액정 격자
    ctx.strokeStyle = COLORS.grid;
    ctx.lineWidth = 1;
    for (var i = 1; i < GRID; i++) {
      var p = i * CELL + 0.5;
      ctx.beginPath();
      ctx.moveTo(p, 0); ctx.lineTo(p, canvas.height);
      ctx.moveTo(0, p); ctx.lineTo(canvas.width, p);
      ctx.stroke();
    }

    // 단색 화면이므로 먹이는 색이 아니라 모양(마름모)으로 구분한다
    if (food) {
      var cx = food.x * CELL + CELL / 2;
      var cy = food.y * CELL + CELL / 2;
      var r = CELL / 2 - 2;
      ctx.fillStyle = COLORS.ink;
      ctx.beginPath();
      ctx.moveTo(cx, cy - r);
      ctx.lineTo(cx + r, cy);
      ctx.lineTo(cx, cy + r);
      ctx.lineTo(cx - r, cy);
      ctx.closePath();
      ctx.fill();
    }

    for (var s = snake.length - 1; s >= 0; s--) {
      var x = snake[s].x * CELL, y = snake[s].y * CELL;
      ctx.fillStyle = COLORS.ink;
      ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
      if (s === 0) {
        // 머리에만 액정 색 눈을 뚫어 진행 방향을 알아보게 한다
        ctx.fillStyle = COLORS.lcd;
        ctx.fillRect(x + CELL / 2 - 1.5, y + CELL / 2 - 1.5, 3, 3);
      }
    }
  }

  function loop(time) {
    if (state !== 'playing') return;
    if (!lastTime) lastTime = time;
    accumulator += time - lastTime;
    lastTime = time;

    while (accumulator >= tickMs && state === 'playing') {
      accumulator -= tickMs;
      step();
    }

    draw();
    requestAnimationFrame(loop);
  }

  function saveBest() {
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) { /* 저장 불가 환경 무시 */ }
    }
  }

  function showOverlay(title, desc, buttonLabel) {
    overlayTitle.textContent = title;
    overlayDesc.innerHTML = desc;
    startBtn.textContent = buttonLabel;
    overlay.hidden = false;
    startBtn.focus();
  }

  function start() {
    reset();
    state = 'playing';
    overlay.hidden = true;
    lastTime = 0;
    requestAnimationFrame(loop);
  }

  function gameOver(reason) {
    state = 'over';
    saveBest();
    draw();
    showOverlay('Game Over', reason + '<br>점수 <b>' + score + '</b>', 'Retry');
  }

  function win() {
    state = 'over';
    saveBest();
    draw();
    showOverlay('Cleared', '판을 가득 채웠어요.<br>점수 <b>' + score + '</b>', 'Retry');
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      showOverlay('Paused', '스페이스바를 누르면<br>이어서 계속합니다.', 'Resume');
    } else if (state === 'paused') {
      state = 'playing';
      overlay.hidden = true;
      lastTime = 0;
      accumulator = 0;
      requestAnimationFrame(loop);
    }
  }

  var KEYS = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right'
  };

  document.addEventListener('keydown', function (e) {
    if (KEYS[e.key]) {
      e.preventDefault();
      if (state === 'playing') setDirection(KEYS[e.key]);
      return;
    }
    if (e.key === ' ') {
      e.preventDefault();
      if (state === 'playing' || state === 'paused') togglePause();
      else start();
      return;
    }
    if (e.key === 'r' || e.key === 'R') start();
  });

  startBtn.addEventListener('click', function () {
    if (state === 'paused') togglePause();
    else start();
  });

  Array.prototype.forEach.call(document.querySelectorAll('.dpad button'), function (btn) {
    btn.addEventListener('click', function () {
      if (state === 'playing') setDirection(btn.dataset.dir);
    });
  });

  // 스와이프 조작
  var touchStart = null;
  canvas.addEventListener('touchstart', function (e) {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });

  canvas.addEventListener('touchend', function (e) {
    if (!touchStart || state !== 'playing') return;
    var dx = e.changedTouches[0].clientX - touchStart.x;
    var dy = e.changedTouches[0].clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDirection(dx > 0 ? 'right' : 'left');
    else setDirection(dy > 0 ? 'down' : 'up');
  }, { passive: true });

  // 첫 화면
  state = 'ready';
  reset();
  draw();
})();
</script>
</body>
</html>
