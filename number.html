<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>숫자 맞히기 — 미니게임</title>
<style>
  /* 주머니 계산기. 스네이크의 흑백 LCD 와 구분되도록 어두운 케이스에 호박색 형광표시관을
     얹었다. 화면 자체가 하나의 사물이므로 단일 테마로 확정하고, 배경과 모든 색을 명시해
     호스트 테마와 무관하게 같은 모습으로 보이게 한다. */
  :root {
    --case:        #14151a;
    --case-face:   #2b2d35;
    --case-edge:   #43464f;
    --case-shadow: #0a0b0e;
    --case-text:   #9aa0ad;   /* 케이스 위 각인 — 어두운 플라스틱에서 5.2:1 */
    --vfd:         #0c0d0b;   /* 표시관 유리 */
    --vfd-edge:    #1e2019;
    --amber:       #ffb545;
    --amber-soft:  #c98a34;
    --amber-faint: #6d4d20;
    --key:         #1d1f25;
    --key-face:    #363943;
    --key-accent:  #b4712a;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    background: var(--case);
    color: var(--amber);
    font-family: var(--mono);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }

  .device {
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 22px;
    border-radius: 18px;
    background: var(--case-face);
    border: 1px solid var(--case-edge);
    box-shadow: 0 1px 0 var(--case-edge) inset, 0 18px 40px -18px var(--case-shadow);
  }

  /* ── 케이스 상단 각인 ─────────────────────────── */
  .brand {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--case-text);
  }

  .brand .model { letter-spacing: 0.14em; opacity: 0.7; }

  /* ── 표시관 ───────────────────────────────────── */
  .screen {
    padding: 14px;
    border-radius: 6px;
    background: var(--vfd);
    box-shadow: 0 2px 8px var(--case-shadow) inset, 0 0 0 2px var(--case-shadow);
  }

  .readout {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 10px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--vfd-edge);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--amber-soft);
  }

  .readout b {
    margin-left: 8px;
    font-size: 17px;
    letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums;
    color: var(--amber);
  }

  .stage {
    position: relative;
    width: min(78vw, 360px);
    min-height: 226px;
    display: flex;
    flex-direction: column;
  }

  /* ── 표시관 본문 ──────────────────────────────── */
  .panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .range {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--amber-soft);
    font-variant-numeric: tabular-nums;
  }

  .entry {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 4px;
    padding: 6px 0 2px;
    font-size: 46px;
    line-height: 1.1;
    letter-spacing: 0.1em;
    font-variant-numeric: tabular-nums;
    color: var(--amber);
    text-shadow: 0 0 14px rgba(255, 181, 69, 0.35);
  }

  .entry.is-empty { color: var(--amber-faint); text-shadow: none; }

  /* 커서는 값을 넣기 전에만 깜빡여, 지금 입력을 받는 중임을 알린다 */
  .entry .caret {
    width: 3px;
    height: 34px;
    background: var(--amber);
    animation: blink 1.1s steps(1, end) infinite;
  }

  .entry .caret[hidden] { display: none; }

  @keyframes blink { 50% { opacity: 0; } }

  .hint {
    min-height: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    text-align: center;
  }

  .hint .verdict {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--amber);
  }

  .hint .warmth {
    font-size: 11.5px;
    letter-spacing: 0.08em;
    color: var(--amber-soft);
  }

  /* ── 지난 시도 ────────────────────────────────── */
  .history {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    justify-content: center;
    min-height: 26px;
    margin-top: auto;
    padding-top: 10px;
    border-top: 1px solid var(--vfd-edge);
  }

  .history .past {
    padding: 3px 7px;
    border-radius: 3px;
    font-size: 11.5px;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    color: var(--amber-soft);
    box-shadow: 0 0 0 1px var(--vfd-edge) inset;
  }

  .history .past.hit {
    color: var(--vfd);
    background: var(--amber);
    box-shadow: none;
  }

  /* ── 화면 위 메시지 ───────────────────────────── */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 18px;
    text-align: center;
    background: var(--vfd);
    color: var(--amber);
  }

  .overlay[hidden] { display: none; }

  .overlay .title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    text-wrap: balance;
  }

  .overlay .desc {
    font-size: 12.5px;
    line-height: 1.75;
    color: var(--amber-soft);
  }

  .overlay .desc b {
    color: var(--amber);
    font-variant-numeric: tabular-nums;
  }

  /* ── 조작부 ───────────────────────────────────── */
  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: 4px;
  }

  button:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }

  .levels {
    display: flex;
    gap: 6px;
    margin-top: 2px;
  }

  .levels[hidden] { display: none; }   /* display:flex 가 hidden 속성을 덮어쓰지 않도록 */

  .levels .level {
    padding: 7px 14px;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--amber);
    background: transparent;
    box-shadow: 0 0 0 1px var(--amber-faint) inset;
  }

  .levels .level.is-on {
    color: var(--vfd);
    background: var(--amber);
    box-shadow: none;
  }

  #start-btn {
    margin-top: 2px;
    padding: 9px 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--vfd);
    background: var(--amber);
  }

  #start-btn:hover { background: var(--amber-soft); }
  #start-btn:active { transform: translateY(1px); }

  .controls {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
  }

  .legend {
    margin: 0;
    font-size: 11px;
    line-height: 2;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--case-text);
  }

  .legend b { color: var(--amber); font-weight: 700; }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 46px);
    gap: 5px;
    flex: none;
  }

  .keypad button {
    height: 38px;
    background: var(--key-face);
    color: var(--amber);
    font-size: 14px;
    line-height: 1;
    box-shadow: 0 2px 0 var(--key);
  }

  .keypad button:active { transform: translateY(2px); box-shadow: none; }

  .keypad .wide { grid-column: span 2; }

  .keypad .enter {
    color: var(--vfd);
    background: var(--amber);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    box-shadow: 0 2px 0 var(--key-accent);
  }

  @media (max-width: 400px) {
    .controls { flex-direction: column; align-items: center; gap: 14px; }
    .legend { text-align: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    button:active { transform: none; }
    .entry .caret { animation: none; }
  }
</style>
</head>
<body>
  <div class="device">
    <div class="brand">
      <span>Number</span>
      <span class="model">hjPlayGround</span>
    </div>

    <div class="screen">
      <div class="readout">
        <span>Score <b id="score">0</b></span>
        <span>Best <b id="best">0</b></span>
      </div>

      <div class="stage">
        <div class="panel">
          <div class="range" id="range">1 – 50 · 남은 기회 10</div>

          <div class="entry is-empty" id="entry">
            <span id="entry-digits">‒‒</span><span class="caret" id="caret" hidden></span>
          </div>

          <div class="hint" id="hint" role="status" aria-live="polite">
            <div class="verdict" id="verdict"></div>
            <div class="warmth" id="warmth"></div>
          </div>

          <div class="history" id="history" aria-label="지난 시도"></div>
        </div>

        <div class="overlay" id="overlay">
          <div class="title" id="overlay-title">Ready</div>
          <div class="desc" id="overlay-desc">숨겨진 숫자를 맞혀 보세요.<br>넣을 때마다 위인지 아래인지 알려줍니다.</div>
          <div class="levels" id="levels" role="group" aria-label="난이도">
            <button class="level is-on" data-level="easy" aria-pressed="true">쉬움</button>
            <button class="level" data-level="normal" aria-pressed="false">보통</button>
            <button class="level" data-level="hard" aria-pressed="false">어려움</button>
          </div>
          <button id="start-btn">Start</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <p class="legend">
        <b>0 – 9</b> 숫자 입력<br>
        <b>Enter</b> 넣기 · <b>Backspace</b> 지우기<br>
        <b>R</b> 다시 시작
      </p>
      <div class="keypad" id="keypad">
        <button data-digit="1">1</button>
        <button data-digit="2">2</button>
        <button data-digit="3">3</button>
        <button data-digit="4">4</button>
        <button data-digit="5">5</button>
        <button data-digit="6">6</button>
        <button data-digit="7">7</button>
        <button data-digit="8">8</button>
        <button data-digit="9">9</button>
        <button data-digit="0">0</button>
        <button class="wide enter" data-act="submit">Enter</button>
        <button class="wide" data-act="clear" aria-label="입력 지우기">← 지우기</button>
        <button data-act="restart" aria-label="다시 시작">R</button>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var rangeEl = document.getElementById('range');
  var entryEl = document.getElementById('entry');
  var entryDigitsEl = document.getElementById('entry-digits');
  var caretEl = document.getElementById('caret');
  var verdictEl = document.getElementById('verdict');
  var warmthEl = document.getElementById('warmth');
  var historyEl = document.getElementById('history');
  var overlay = document.getElementById('overlay');
  var overlayTitle = document.getElementById('overlay-title');
  var overlayDesc = document.getElementById('overlay-desc');
  var levelsEl = document.getElementById('levels');
  var startBtn = document.getElementById('start-btn');
  var keypad = document.getElementById('keypad');

  // 기회는 이분 탐색에 필요한 횟수(각각 6 / 7 / 9회)보다 넉넉하게 준다.
  // 근접 힌트는 쉬움에서만 켜서, 난이도 차이가 범위뿐 아니라 정보량에서도 나게 한다.
  var LEVELS = {
    easy:   { min: 1, max: 50,  tries: 10, warmth: true,  points: 10 },
    normal: { min: 1, max: 100, tries: 8,  warmth: false, points: 25 },
    hard:   { min: 1, max: 500, tries: 10, warmth: false, points: 40 }
  };

  var BEST_KEY = 'number.best';
  var LEVEL_KEY = 'number.level';

  var levelName, level;
  var secret, entry, triesLeft, guesses, score, best, state;   // state: ready | playing | over
  var noticeShown;   // 기회를 쓰지 않은 안내(범위 밖 · 중복)를 띄워 둔 상태인지

  function readBest() {
    // 난이도마다 점수 체계가 다르므로 최고 점수도 따로 기록한다
    return Number(localStorage.getItem(BEST_KEY + '.' + levelName) || 0);
  }

  function setLevel(name) {
    levelName = LEVELS[name] ? name : 'easy';
    level = LEVELS[levelName];
    try { localStorage.setItem(LEVEL_KEY, levelName); } catch (e) { /* 저장 불가 환경 무시 */ }

    Array.prototype.forEach.call(document.querySelectorAll('.level'), function (btn) {
      var on = btn.dataset.level === levelName;
      btn.classList.toggle('is-on', on);
      btn.setAttribute('aria-pressed', String(on));
    });

    best = readBest();
    bestEl.textContent = best;
  }

  function reset() {
    var span = level.max - level.min + 1;
    secret = level.min + Math.floor(Math.random() * span);
    entry = '';
    triesLeft = level.tries;
    guesses = [];
    score = 0;
    state = 'ready';
    noticeShown = false;

    scoreEl.textContent = score;
    verdictEl.textContent = '';
    warmthEl.textContent = '';
    historyEl.textContent = '';
    draw();
  }

  function draw() {
    rangeEl.textContent = level.min + ' – ' + level.max + ' · 남은 기회 ' + triesLeft;

    var empty = entry === '';
    entryDigitsEl.textContent = empty ? '‒‒' : entry;
    entryEl.classList.toggle('is-empty', empty);
    // 게임이 끝났으면 더 받을 입력이 없으므로 커서를 숨긴다
    caretEl.hidden = state !== 'playing';
  }

  function renderHistory() {
    historyEl.textContent = '';
    guesses.forEach(function (g) {
      var chip = document.createElement('span');
      chip.className = 'past' + (g.mark === '✔' ? ' hit' : '');
      chip.textContent = g.mark + ' ' + g.value;
      historyEl.appendChild(chip);
    });
  }

  function warmthOf(guess) {
    if (!level.warmth) return '';
    var span = level.max - level.min;
    var ratio = Math.abs(guess - secret) / span;
    if (ratio <= 0.02) return '앗 아주 뜨거워요';
    if (ratio <= 0.06) return '뜨거워요';
    if (ratio <= 0.15) return '따뜻해요';
    if (ratio <= 0.35) return '미지근해요';
    return '차가워요';
  }

  function showOverlay(title, desc, withLevels, startLabel) {
    overlayTitle.textContent = title;
    overlayDesc.innerHTML = desc;
    levelsEl.hidden = !withLevels;
    startBtn.textContent = startLabel;
    overlay.hidden = false;
  }

  function readyScreen() {
    reset();
    showOverlay(
      'Ready',
      '<b>' + level.min + ' – ' + level.max + '</b> 사이의 숫자를 숨겼습니다.<br>' +
      '<b>' + level.tries + '</b>번 안에 맞혀 보세요.',
      true,
      'Start'
    );
  }

  function start() {
    reset();
    state = 'playing';
    overlay.hidden = true;
    draw();
  }

  function finish(won) {
    state = 'over';

    if (won) {
      // 남은 기회가 많을수록 높은 점수. 마지막 기회에 맞혀도 한 몫은 챙긴다
      score = (triesLeft + 1) * level.points;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        try { localStorage.setItem(BEST_KEY + '.' + levelName, String(best)); } catch (e) { /* 저장 불가 환경 무시 */ }
      }
    }

    draw();

    var used = level.tries - triesLeft;
    showOverlay(
      won ? 'Clear' : 'Game Over',
      won
        ? '숨은 수는 <b>' + secret + '</b>.<br><b>' + used + '</b>번 만에 맞혔습니다 · <b>' + score + '</b>점'
        : '숨은 수는 <b>' + secret + '</b> 였습니다.',
      true,
      'Retry'
    );
  }

  // 기회를 쓰지 않은 안내. 다음 숫자를 누르기 시작하면 지운다
  function notice(title, detail) {
    verdictEl.textContent = title;
    warmthEl.textContent = detail;
    noticeShown = true;
    draw();
  }

  function submit() {
    if (state !== 'playing' || entry === '') return;

    var guess = Number(entry);
    entry = '';

    if (guess < level.min || guess > level.max) {
      notice('범위 밖', level.min + ' 에서 ' + level.max + ' 사이로 넣어 주세요');
      return;   // 잘못 누른 값으로 기회를 잃지는 않는다
    }

    var already = guesses.some(function (g) { return g.value === guess; });
    if (already) {
      notice('이미 넣은 수', '다른 수로 해 보세요');
      return;
    }

    noticeShown = false;
    triesLeft -= 1;

    if (guess === secret) {
      guesses.push({ value: guess, mark: '✔' });
      renderHistory();
      verdictEl.textContent = '정답!';
      warmthEl.textContent = '';
      finish(true);
      return;
    }

    var low = guess < secret;
    guesses.push({ value: guess, mark: low ? '▲' : '▼' });
    renderHistory();
    verdictEl.textContent = low ? '▲ 더 큰 수' : '▼ 더 작은 수';
    warmthEl.textContent = warmthOf(guess);

    if (triesLeft === 0) { finish(false); return; }
    draw();
  }

  function typeDigit(d) {
    if (state !== 'playing') return;
    if (entry === '0') entry = '';                     // 앞자리 0 은 자리만 차지한다
    if (entry.length >= String(level.max).length) return;
    entry += d;
    if (noticeShown) {
      verdictEl.textContent = '';
      warmthEl.textContent = '';
      noticeShown = false;
    }
    draw();
  }

  function backspace() {
    if (state !== 'playing' || entry === '') return;
    entry = entry.slice(0, -1);
    draw();
  }

  // ── 입력 ──────────────────────────────────────
  document.addEventListener('keydown', function (e) {
    if (e.key >= '0' && e.key <= '9') { typeDigit(e.key); e.preventDefault(); return; }

    switch (e.key) {
      case 'Enter':
        if (state === 'playing') submit();
        else start();
        e.preventDefault();
        break;
      case 'Backspace':
        backspace();
        e.preventDefault();
        break;
      case 'Delete':
      case 'Escape':
        if (state === 'playing') { entry = ''; draw(); }
        e.preventDefault();
        break;
      case 'r':
      case 'R':
        readyScreen();
        break;
    }
  });

  keypad.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    if (btn.dataset.digit) { typeDigit(btn.dataset.digit); return; }
    if (btn.dataset.act === 'submit') submit();
    else if (btn.dataset.act === 'clear') backspace();
    else if (btn.dataset.act === 'restart') readyScreen();
  });

  levelsEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.level');
    if (!btn) return;
    setLevel(btn.dataset.level);
    readyScreen();
  });

  startBtn.addEventListener('click', start);

  setLevel(localStorage.getItem(LEVEL_KEY) || 'easy');
  readyScreen();
})();
</script>
</body>
</html>
