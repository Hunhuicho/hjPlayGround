<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>숫자 길 — 갈림길 미니게임</title>
<style>
  /* 어두운 손바닥 기기 안에, 색색의 블록으로 깔린 길이 흐른다.
     화면 자체가 하나의 사물이므로 단일 테마로 확정하고, 배경과 모든 색을 명시해
     호스트 테마와 무관하게 같은 모습으로 보이게 한다. */
  :root {
    --case:        #14151a;
    --case-face:   #2b2d35;
    --case-edge:   #43464f;
    --case-shadow: #0a0b0e;
    --case-text:   #9aa0ad;   /* 케이스 위 각인 — 어두운 플라스틱에서 5.2:1 */
    --screen:      #0b0c10;
    --screen-edge: #1c1e26;
    --ink:         #ffd48a;
    --ink-soft:    #c2a173;
    --ink-faint:   #6f6047;
    --good:        #6fd08c;
    --bad:         #ff6a4d;
    --key:         #1d1f25;
    --key-face:    #363943;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    background: var(--case);
    color: var(--ink);
    font-family: var(--mono);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }

  .device {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 20px;
    border-radius: 18px;
    background: var(--case-face);
    border: 1px solid var(--case-edge);
    box-shadow: 0 1px 0 var(--case-edge) inset, 0 18px 40px -18px var(--case-shadow);
  }

  /* ── 케이스 상단 각인 ─────────────────────────── */
  .brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--case-text);
  }

  .brand .model { letter-spacing: 0.14em; opacity: 0.7; }

  /* ── 화면 ─────────────────────────────────────── */
  .screen {
    padding: 12px;
    border-radius: 6px;
    background: var(--screen);
    box-shadow: 0 2px 8px var(--case-shadow) inset, 0 0 0 2px var(--case-shadow);
  }

  .readout {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-bottom: 8px;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .readout b {
    margin-left: 5px;
    font-size: 14px;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }

  /* 상점은 화면 한구석에 작은 아이콘으로만 둔다 */
  .shop-btn {
    position: relative;
    flex: none;
    width: 26px;
    height: 24px;
    display: grid;
    place-items: center;
    color: var(--ink-soft);
    background: transparent;
    box-shadow: 0 0 0 1px var(--ink-faint) inset;
  }

  .shop-btn:hover { color: var(--ink); }
  .shop-btn svg { width: 14px; height: 14px; display: block; }

  .shop-btn .badge {
    position: absolute;
    top: -5px;
    right: -5px;
    min-width: 13px;
    height: 13px;
    padding: 0 3px;
    border-radius: 7px;
    font-size: 9px;
    line-height: 13px;
    font-weight: 700;
    color: #0b0c10;
    background: var(--good);
  }

  .shop-btn .badge[hidden] { display: none; }

  .quiz {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 6px 4px 8px;
    margin-bottom: 9px;
    border-top: 1px solid var(--screen-edge);
    border-bottom: 1px solid var(--screen-edge);
    text-align: center;
  }

  .quiz .where {
    font-size: 9.5px;
    letter-spacing: 0.16em;
    color: var(--ink-faint);
  }

  .quiz .ask {
    font-size: 13.5px;
    letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
    word-break: keep-all;
  }

  .stage {
    position: relative;
    width: min(78vw, 360px);
    aspect-ratio: 360 / 360;
  }

  canvas { width: 100%; height: 100%; display: block; }

  /* ── 화면 위 메시지 ───────────────────────────── */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 13px;
    overflow-y: auto;
    text-align: center;
    background: rgba(11, 12, 16, 0.95);
    color: var(--ink);
  }

  .overlay[hidden] { display: none; }

  .overlay .title {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-wrap: balance;
  }

  .overlay .title.is-bad  { color: var(--bad); }
  .overlay .title.is-good { color: var(--good); }

  .overlay .desc {
    font-size: 11.5px;
    line-height: 1.7;
    color: var(--ink-soft);
    word-break: keep-all;
  }

  .overlay .desc b {
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .overlay .desc[hidden], .choices[hidden], .actions[hidden] { display: none; }

  /* ── 고르기 ───────────────────────────────────── */
  .choices {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    justify-content: center;
    width: 100%;
  }

  .choices button {
    padding: 7px 10px;
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--ink);
    background: transparent;
    box-shadow: 0 0 0 1px var(--ink-faint) inset;
    word-break: keep-all;
  }

  .choices button:hover { background: #1a1c24; }

  .choices button .no {
    margin-right: 5px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-faint);
  }

  /* ── 상점 진열 ────────────────────────────────── */
  .choices.wardrobe button {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    width: 74px;
    padding: 6px 3px 5px;
    font-size: 9.5px;
    line-height: 1.3;
    color: var(--ink-soft);
  }

  .choices.wardrobe button canvas { width: 34px; height: 42px; }

  .choices.wardrobe button.is-locked { opacity: 0.5; }
  .choices.wardrobe button.is-worn {
    color: var(--good);
    box-shadow: 0 0 0 1px var(--good) inset;
  }

  /* ── 단추 ─────────────────────────────────────── */
  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: 4px;
  }

  button:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }

  .actions {
    display: flex;
    gap: 6px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }

  .actions .go {
    padding: 9px 18px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #0b0c10;
    background: var(--ink);
  }

  .actions .go:hover { background: var(--ink-soft); }

  .actions .sub {
    padding: 8px 12px;
    font-size: 10.5px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    background: transparent;
    box-shadow: 0 0 0 1px var(--ink-faint) inset;
  }

  .actions .sub:hover { color: var(--ink); }
  .actions button:active { transform: translateY(1px); }

  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .legend {
    margin: 0;
    font-size: 10.5px;
    line-height: 1.95;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--case-text);
  }

  .legend b { color: var(--ink); font-weight: 700; }

  .pads {
    display: flex;
    gap: 6px;
    flex: none;
  }

  .pads button {
    width: 54px;
    height: 46px;
    background: var(--key-face);
    color: var(--ink);
    font-size: 15px;
    line-height: 1;
    box-shadow: 0 3px 0 var(--key);
  }

  .pads .jump {
    width: 62px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
  }

  .pads button:active { transform: translateY(3px); box-shadow: none; }

  @media (max-width: 420px) {
    .controls { flex-direction: column; gap: 12px; }
    .legend { text-align: center; }
    .pads button { width: 64px; height: 52px; }
    .pads .jump { width: 76px; }
  }

  @media (prefers-reduced-motion: reduce) {
    button:active { transform: none; }
  }
</style>
</head>
<body>
  <div class="device">
    <div class="brand">
      <span>Number Path</span>
      <span class="model">hjPlayGround</span>
    </div>

    <div class="screen">
      <div class="readout">
        <span>스테이지 <b id="stage-no">1/5</b></span>
        <span>문제 <b id="gate-no">0/4</b></span>
        <span>최고 <b id="best">0</b></span>
        <button class="shop-btn" id="shop-btn" aria-label="상점 열기" title="상점">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 8h16l-1.2 12H5.2L4 8z"/>
            <path d="M8.5 8V6a3.5 3.5 0 0 1 7 0v2"/>
          </svg>
          <span class="badge" id="shop-badge" hidden>1</span>
        </button>
      </div>

      <div class="quiz" role="status" aria-live="polite">
        <span class="where" id="where">단원을 고르세요</span>
        <span class="ask" id="quiz">—</span>
      </div>

      <div class="stage">
        <canvas id="board" width="720" height="720"></canvas>
        <div class="overlay" id="overlay">
          <div class="title" id="overlay-title">어디까지 배웠나요?</div>
          <div class="desc" id="overlay-desc"></div>
          <div class="choices" id="choices"></div>
          <div class="actions" id="actions"></div>
        </div>
      </div>
    </div>

    <div class="controls">
      <p class="legend">
        <b>←</b> 왼쪽 길 · <b>→</b> 오른쪽 길<br>
        <b>↑</b> 또는 <b>Space</b> 점프<br>
        <b>P</b> 일시정지 · <b>R</b> 다시 시작
      </p>
      <div class="pads">
        <button data-side="-1" aria-label="왼쪽 길로">◀</button>
        <button class="jump" data-act="jump" aria-label="점프">JUMP</button>
        <button data-side="1" aria-label="오른쪽 길로">▶</button>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  // ══ 문제 만들기 ═══════════════════════════════
  function ri(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function fmt(n) { return String(n).replace('-', '−'); }        // 빼기표는 하이픈이 아니라 −
  function Q(text, answer, decoy) { return { text: text, answer: answer, decoy: decoy }; }
  function dec(n) { return (n / 10).toFixed(1); }                // 소수는 정수로 셈하고 마지막에 나눈다

  function mix() {
    var gens = Array.prototype.slice.call(arguments);
    return function () { return pick(gens)(); };
  }

  // 고정 문답 목록에서 하나 뽑는다 — 도형의 개수처럼 셈이 아닌 것들에 쓴다
  function facts(list) {
    return function () { var f = pick(list); return Q(f[0], f[1]); };
  }

  function gAdd(a1, a2, b1, b2) {
    return function () { var a = ri(a1, a2), b = ri(b1, b2); return Q(a + ' + ' + b, a + b); };
  }

  function gSub(a1, a2) {
    return function () { var a = ri(a1, a2), b = ri(1, a - 1); return Q(a + ' − ' + b, a - b); };
  }

  function gMul(a1, a2, b1, b2) {
    return function () { var a = ri(a1, a2), b = ri(b1, b2); return Q(a + ' × ' + b, a * b); };
  }

  function gDiv(q1, q2, b1, b2) {
    // 나누어떨어지도록 몫을 먼저 정하고 거꾸로 문제를 만든다
    return function () { var q = ri(q1, q2), b = ri(b1, b2); return Q((q * b) + ' ÷ ' + b, q); };
  }

  function gNumSense(lo, hi) {
    return function () {
      var n = ri(lo + 1, hi - 1);
      var t = ri(0, 2);
      if (t === 0) return Q(n + ' 다음 수', n + 1);
      if (t === 1) return Q(n + ' 앞의 수', n - 1);
      var m = ri(lo, hi);
      while (m === n) m = ri(lo, hi);
      return Q(n + '과 ' + m + ' 중 큰 수', Math.max(n, m), Math.min(n, m));
    };
  }

  function gBundle(hi) {
    return function () {
      var t = ri(1, Math.floor(hi / 10) - 1), o = ri(1, 9);
      return Q('10개씩 ' + t + '묶음, 낱개 ' + o, t * 10 + o);
    };
  }

  function gPlace(digits) {
    var names = ['일', '십', '백', '천'];
    return function () {
      var s = '';
      for (var i = 0; i < digits; i++) s += (i === 0 ? ri(1, 9) : ri(0, 9));
      var d = ri(0, digits - 1);
      return Q(s + ' 의 ' + names[d] + '의 자리 숫자', Number(s[digits - 1 - d]));
    };
  }

  function gSeq() {
    return function () {
      var a = ri(1, 9), d = ri(2, 6), s = [];
      for (var i = 0; i < 4; i++) s.push(a + d * i);
      return Q(s.join(', ') + ', ?', a + d * 4);
    };
  }

  function gSum3() {
    return function () {
      var a = ri(3, 20), b = ri(3, 20), c = ri(3, 20);
      return Q(a + ' + ' + b + ' + ' + c, a + b + c);
    };
  }

  function gFracAdd() {          // 분모가 같은 분수의 덧셈 — 분모까지 더하는 실수를 곁길로 놓는다
    var d = ri(4, 9), a = ri(1, d - 2), b = ri(1, d - a);
    return Q(a + '/' + d + ' + ' + b + '/' + d, (a + b) + '/' + d, (a + b) + '/' + (d * 2));
  }

  function gFracSub() {
    var d = ri(4, 9), a = ri(2, d), b = ri(1, a - 1);
    return Q(a + '/' + d + ' − ' + b + '/' + d, (a - b) + '/' + d, (a - b) + '/' + (d - b));
  }

  function gFracUnlike() {       // 분모가 다른 분수의 덧셈
    var d1 = ri(2, 5), d2 = d1 * ri(2, 3);
    var a = ri(1, d1 - 1), b = ri(1, d2 - 1);
    var top = a * (d2 / d1) + b;
    return Q(a + '/' + d1 + ' + ' + b + '/' + d2, top + '/' + d2, (a + b) + '/' + d2);
  }

  function gFracOfNum() {        // 전체의 몇 분의 몇
    var d = pick([2, 3, 4, 5, 6]), n = ri(1, d - 1), unit = ri(2, 9);
    return Q((d * unit) + ' 의 ' + n + '/' + d, n * unit);
  }

  function gFracDivInt() {       // (분수) ÷ (자연수)
    var d = ri(3, 9), k = ri(2, 4), a = ri(1, 3) * k;
    while (a >= d) { a -= k; }
    if (a < k) a = k;
    return Q(a + '/' + d + ' ÷ ' + k, (a / k) + '/' + d, a + '/' + (d * k));
  }

  function gFracDivFrac() {      // (분수) ÷ (분수) — 분모가 같아 몫이 자연수로 떨어지게
    var d = ri(3, 9), b = ri(1, 3), q = ri(2, 5);
    return Q((b * q) + '/' + d + ' ÷ ' + b + '/' + d, q);
  }

  function gDecAdd() { var a = ri(11, 89), b = ri(11, 89); return Q(dec(a) + ' + ' + dec(b), dec(a + b), dec(a + b + 10)); }
  function gDecSub() { var a = ri(30, 99), b = ri(11, a - 5); return Q(dec(a) + ' − ' + dec(b), dec(a - b), dec(a - b + 10)); }
  function gDecMul() { var a = ri(2, 9), b = ri(2, 9); return Q(dec(a) + ' × ' + b, dec(a * b), dec(a * b + 10)); }
  function gDecDiv() { var q = ri(11, 49), b = ri(2, 6); return Q(dec(q * b) + ' ÷ ' + b, dec(q), dec(q * 10)); }
  function gDecDivDec() { var q = ri(2, 9), b = ri(2, 9); return Q(dec(q * b) + ' ÷ ' + dec(b), q); }

  function gRound() {
    return function () {
      var n = ri(1000, 9999);
      var t = ri(0, 2);
      if (t === 0) return Q(n + ' 을 십의 자리에서 반올림', Math.round(n / 100) * 100);
      if (t === 1) return Q(n + ' 을 백의 자리까지 올림', Math.ceil(n / 100) * 100);
      return Q(n + ' 을 백의 자리까지 버림', Math.floor(n / 100) * 100);
    };
  }

  function gcd(a, b) { return b ? gcd(b, a % b) : a; }

  function gGcdLcm() {
    return function () {
      var a = ri(4, 24), b = ri(4, 24);
      var g = gcd(a, b);
      if (ri(0, 1)) return Q(a + '과 ' + b + ' 의 최대공약수', g, Math.min(a, b));
      return Q(a + '과 ' + b + ' 의 최소공배수', a * b / g, a * b);
    };
  }

  function gReduce() {           // 약분
    return function () {
      var d = ri(2, 6), k = ri(2, 6), n = ri(1, d - 1);
      return Q((n * k) + '/' + (d * k) + ' 를 약분하면 ?/' + d, n);
    };
  }

  function gMixed() {            // 자연수의 혼합 계산
    return function () {
      var a = ri(2, 20), b = ri(2, 9), c = ri(2, 9);
      if (ri(0, 1)) return Q(a + ' + ' + b + ' × ' + c, a + b * c, (a + b) * c);
      return Q(a * b + ' ÷ ' + b + ' + ' + c, a + c);
    };
  }

  function gRule() {             // 규칙과 대응
    return function () {
      var k = ri(2, 9), x = ri(2, 9);
      return Q('□ = ○ × ' + k + ', ○ = ' + x, k * x);
    };
  }

  function gRect() {             // 직사각형의 넓이와 둘레
    return function () {
      var a = ri(3, 14), b = ri(3, 14);
      if (ri(0, 1)) return Q('가로 ' + a + ', 세로 ' + b + ' 넓이', a * b, 2 * (a + b));
      return Q('가로 ' + a + ', 세로 ' + b + ' 둘레', 2 * (a + b), a * b);
    };
  }

  function gTriArea() {
    return function () {
      var b = ri(2, 9) * 2, h = ri(3, 12);
      return Q('밑변 ' + b + ', 높이 ' + h + ' 삼각형 넓이', b * h / 2, b * h);
    };
  }

  function gBox() {              // 직육면체의 부피
    return function () {
      var a = ri(2, 9), b = ri(2, 9), c = ri(2, 6);
      return Q(a + '×' + b + '×' + c + ' 직육면체 부피', a * b * c, a + b + c);
    };
  }

  function gAverage() {
    return function () {
      var n = ri(3, 4), s = [], sum = 0, avg = ri(3, 15);
      for (var i = 0; i < n - 1; i++) { var v = ri(1, avg * 2); s.push(v); sum += v; }
      s.push(avg * n - sum);
      if (s[n - 1] < 1) s[n - 1] = 1;
      sum = s.reduce(function (p, c) { return p + c; }, 0);
      return Q(s.join(', ') + ' 의 평균', Math.round(sum / n * 100) / 100);
    };
  }

  function gPercent() {
    return function () {
      var whole = pick([20, 25, 40, 50, 200]), part = whole * pick([0.1, 0.2, 0.25, 0.5, 0.75]);
      return Q(whole + ' 에 대한 ' + part + ' 의 비율(%)', Math.round(part / whole * 100));
    };
  }

  function gRatio() {            // 비례식
    return function () {
      var a = ri(2, 9), b = ri(2, 9), k = ri(2, 5);
      return Q(a + ':' + b + ' = ' + (a * k) + ':?', b * k);
    };
  }

  function gCircle() {           // 원주율은 3.14
    return function () {
      var r = ri(2, 9);
      var t = ri(0, 2);
      if (t === 0) return Q('반지름 ' + r + ' 원의 지름', r * 2, r / 2);

    { id: 'dress',   name: '공주 드레스', shirt: '#ff7ab8', arm: '#eb6aa6', pants: '#ff9ec9', skirt: true, crown: true },
    { id: 'rainbow', name: '무지개 망토', shirt: '#f7f7f2', arm: '#dcdcd4', pants: '#3a3f4b', cape: true }
  ];

  var RAINBOW = ['#e8453c', '#f08c2e', '#f7cf3f', '#5fbf5f', '#3f9ed6', '#4b56c9', '#8c5bc7'];

  function clothOf(id) {
    for (var i = 0; i < CLOTHES.length; i++) if (CLOTHES[i].id === id) return CLOTHES[i];
    return CLOTHES[0];
  }

  var OWNED_KEY = 'numberpath.owned';
  var WEAR_KEY = 'numberpath.wearing';
  var TICKET_KEY = 'numberpath.tickets';

  var owned, wearing, tickets;

  function loadCloset() {
    var raw = null;
    try { raw = JSON.parse(localStorage.getItem(OWNED_KEY) || 'null'); } catch (e) { raw = null; }
    owned = Array.isArray(raw) && raw.length ? raw : ['tee'];
    if (owned.indexOf('tee') < 0) owned.push('tee');

    wearing = localStorage.getItem(WEAR_KEY) || 'tee';
    if (owned.indexOf(wearing) < 0) wearing = 'tee';

    tickets = Number(localStorage.getItem(TICKET_KEY) || 0);
  }

  function saveCloset() {
    try {
      localStorage.setItem(OWNED_KEY, JSON.stringify(owned));
      localStorage.setItem(WEAR_KEY, wearing);
      localStorage.setItem(TICKET_KEY, String(tickets));
    } catch (e) { /* 저장 불가 환경 무시 */ }
  }

  // ══ 화면 · 길의 치수 ══════════════════════════
  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');

  var W = 360, H = 360;                 // 그림은 논리 좌표로, 백업 버퍼는 2배로 잡아 또렷하게
  ctx.setTransform(2, 0, 0, 2, 0, 0);

  var FONT = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';

  var TILE = 20;                        // 블록 한 칸 (스터드 하나)
  var ROAD_L = 30, ROAD_R = 330;        // 길 폭 300 = 15칸
  var COLS = (ROAD_R - ROAD_L) / TILE;
  var CENTER = (ROAD_L + ROAD_R) / 2;
  var MEDIAN_W = 60;
  var MEDIAN_L = CENTER - MEDIAN_W / 2;
  var MEDIAN_R = CENTER + MEDIAN_W / 2;
  var LANE_X = { '-1': (ROAD_L + MEDIAN_L) / 2, '1': (MEDIAN_R + ROAD_R) / 2 };

  var PLAYER_Y = 286;                   // 화면 위 아바타의 자리
  var SEE_AHEAD = PLAYER_Y;
  var FORK_LEN = 150;                   // 갈림길이 갈라지는 지점 ~ 관문
  var MEDIAN_TAIL = 54;                 // 관문을 지난 뒤에도 분리대가 이어지는 길이
  var SEG = 430;                        // 관문 사이 간격 — 구멍과 무너지는 타일이 놓일 자리
  var QUESTION_BACK = 44;               // 갈림길 앞, 길바닥에 세워지는 표지판 자리

  var GATES_PER_STAGE = 4;
  var STAGE_COUNT = 5;
  var STAIRS_STEP = 13;                 // 무지개 계단 한 칸의 깊이
  var CRUMBLE_EVERY = 3;                // 밟은 뒤 타일이 하나씩 사라지는 간격(초)
  var JUMP_DUR = 0.75;
  var JUMP_HIGH = 34;

  // ── 블록 바닥 ────────────────────────────────
  var PALETTE = ['#c9564c', '#d3853f', '#dcbb55', '#5da566', '#4a90c2', '#5b63ad', '#a96b98', '#ddd9cd', '#88919e'];

  var plates = PALETTE.map(function (c) { return makePlate(c); });

  function shade(hex, k) {
    var n = parseInt(hex.slice(1), 16);
    var r = Math.max(0, Math.min(255, Math.round(((n >> 16) & 255) * k)));
    var g = Math.max(0, Math.min(255, Math.round(((n >> 8) & 255) * k)));
    var b = Math.max(0, Math.min(255, Math.round((n & 255) * k)));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  // 스터드가 박힌 타일 한 장을 미리 그려 두고 매 칸 찍어 낸다 — 매 프레임 원을 다시 그리지 않게
  function makePlate(color) {
    var c = document.createElement('canvas');
    c.width = TILE * 2; c.height = TILE * 2;
    var g = c.getContext('2d');
    g.setTransform(2, 0, 0, 2, 0, 0);

    g.fillStyle = color;
    g.fillRect(0, 0, TILE, TILE);

    g.strokeStyle = shade(color, 0.78);
    g.lineWidth = 1;
    g.strokeRect(0.5, 0.5, TILE - 1, TILE - 1);

    g.fillStyle = shade(color, 0.82);
    g.beginPath();
    g.arc(TILE / 2, TILE / 2 + 1.2, 6, 0, Math.PI * 2);
    g.fill();

    g.fillStyle = shade(color, 1.12);
    g.beginPath();
    g.arc(TILE / 2, TILE / 2, 6, 0, Math.PI * 2);
    g.fill();

    g.strokeStyle = shade(color, 0.9);
    g.lineWidth = 1;
    g.beginPath();
    g.arc(TILE / 2, TILE / 2, 6, 0, Math.PI * 2);
    g.stroke();

    return c;
  }

  // 자리마다 늘 같은 색이 나오도록 좌표를 섞어 팔레트를 고른다.
  // 한 칸씩 색이 튀면 눈이 어지러워, 2×2 덩어리로 묶어 색을 나눈다.
  function plateAt(col, row) {
    var h = ((col >> 1) * 374761393 + (row >> 1) * 668265263) >>> 0;
    h = (h ^ (h >>> 13)) * 1274126177 >>> 0;
    return plates[(h >>> 4) % plates.length];
  }

  // ══ 판의 상태 ═════════════════════════════════
  var scoreEl = { stage: document.getElementById('stage-no'), gate: document.getElementById('gate-no') };
  var bestEl = document.getElementById('best');
  var quizEl = document.getElementById('quiz');
  var whereEl = document.getElementById('where');
  var overlay = document.getElementById('overlay');
  var overlayTitle = document.getElementById('overlay-title');
  var overlayDesc = document.getElementById('overlay-desc');
  var choicesEl = document.getElementById('choices');
  var actionsEl = document.getElementById('actions');
  var shopBtn = document.getElementById('shop-btn');
  var shopBadge = document.getElementById('shop-badge');
  var pads = document.querySelector('.pads');

  var BEST_KEY = 'numberpath.best';
  var SEL_KEY = 'numberpath.unit';

  var sel = null, gen = null, pace = null, best = 0;
  var state = 'menu';                   // menu | ready | playing | paused | over | cleared | shop
  var stageNo, dist, speed, gates, holes, cracks, stairsY, passed;
  var lane, playerX, locked, lockedLane, jump, flash, lastTime;

  // ── 관문 만들기 ──────────────────────────────
  function autoDecoy(ans) {
    var mag = Math.abs(ans);
    var deltas = mag >= 1000 ? [1, 10, 100, 1000] : mag >= 100 ? [1, 2, 10, 100] : mag >= 20 ? [1, 2, 5, 10] : [1, 2, 3];
    var out = [];
    deltas.forEach(function (d) { out.push(ans + d, ans - d); });
    out = out.filter(function (n) { return n !== ans && (ans < 0 || n >= 0); });
    return out.length ? pick(out) : ans + 1;
  }

  function makeGate(y) {
    var q = gen();
    var answer = fmt(q.answer);
    var decoy = q.decoy != null ? fmt(q.decoy) : fmt(autoDecoy(Number(q.answer)));
    if (decoy === answer) {
      var n = Number(q.answer);
      if (isFinite(n)) {
        decoy = fmt(autoDecoy(n));
      } else {
        var frac = /^(-?\d+)\/(\d+)$/.exec(answer);   // 분수라면 분자를 하나 밀어 둔다
        decoy = frac ? (Number(frac[1]) + 1) + '/' + frac[2] : answer + '?';
      }
    }
    var side = ri(0, 1) ? 1 : -1;
    return {
      y: y, text: q.text, answer: answer, side: side,
      left: side === -1 ? answer : decoy,
      right: side === 1 ? answer : decoy,
      done: false
    };
  }

  // 스테이지 하나 = 문제 네 개 + 그 사이의 구멍과 무너지는 타일 + 끝의 무지개 계단
  function buildStage() {
    dist = 0;
    gates = [];
    holes = [];
    cracks = [];
    passed = 0;
    lane = -1;
    playerX = LANE_X['-1'];
    locked = false;
    lockedLane = -1;
    jump = null;
    flash = null;

    var y = 340;
    for (var i = 0; i < GATES_PER_STAGE; i++) {
      if (i) y += SEG;
      gates.push(makeGate(y));
    }

    // 아바타가 뛰어 건널 수 있는 만큼만 벌린다 — 한 번 뛰면 speed × 0.75 를 가니 그 3분의 1쯤
    var gapW = Math.max(24, Math.min(60, speed * 0.26));

    for (i = 0; i < GATES_PER_STAGE; i++) {
      var from = i === 0 ? 90 : gates[i - 1].y + MEDIAN_TAIL + 46;
      var to = gates[i].y - FORK_LEN - 40;
      if (to - from < 150) continue;
      if (i === 0 && stageNo === 1) continue;          // 첫 스테이지 첫 구간은 몸을 풀라고 비워 둔다

      if (Math.random() < 0.42 + stageNo * 0.1) {
        var s = ri(Math.round(from), Math.round(to - gapW));
        holes.push({ y0: s, y1: s + gapW });
        from = s + gapW + 40;
      }

      // 밟으면 하나씩 사라지는 금 간 타일 — 3초에 한 칸씩이라 지나가고 나서 무너진다
      if (to - from > 90 && Math.random() < 0.3 + stageNo * 0.1) {
        var n = ri(3, 5);
        var top = ri(Math.round(from), Math.round(to - n * TILE));
        cracks.push({ y0: top, n: n, t: null });
      }
    }

    stairsY = gates[GATES_PER_STAGE - 1].y + 250;
    draw();
    updateHud();
  }

  function currentGate() {
    for (var i = 0; i < gates.length; i++) if (!gates[i].done) return gates[i];
    return null;
  }

  // 무너져 내린 칸도 구멍으로 친다
  function fallen(crack, i) { return crack.t !== null && crack.t >= CRUMBLE_EVERY * (i + 1); }

  function overHole(y) {
    for (var i = 0; i < holes.length; i++) if (y > holes[i].y0 + 2 && y < holes[i].y1 - 2) return true;
    for (i = 0; i < cracks.length; i++) {
      var c = cracks[i];
      for (var k = 0; k < c.n; k++) {
        if (!fallen(c, k)) continue;
        var y0 = c.y0 + k * TILE;
        if (y > y0 + 2 && y < y0 + TILE - 2) return true;
      }
    }
    return false;
  }

  // ══ 판 고르기 · 준비 ══════════════════════════
  function readBest() { return Number(localStorage.getItem(BEST_KEY + '.' + unitId(sel)) || 0); }

  function updateHud() {
    scoreEl.stage.textContent = stageNo + '/' + STAGE_COUNT;
    scoreEl.gate.textContent = passed + '/' + GATES_PER_STAGE;
    bestEl.textContent = best;
    shopBadge.hidden = tickets <= 0;
    shopBadge.textContent = tickets;
  }

  function chooseUnit(next) {
    sel = next;
    gen = unitsOf(sel)[sel.unit][1];
    pace = paceOf(sel);
    best = readBest();
    whereEl.textContent = unitLabel(sel);
    try { localStorage.setItem(SEL_KEY, JSON.stringify(sel)); } catch (e) { /* 저장 불가 환경 무시 */ }
    stageNo = 1;
    speed = pace.speed;
    readyScreen();
  }

  // ── 화면 위 메시지 ───────────────────────────
  function button(cls, label, onClick) {
    var b = document.createElement('button');
    b.className = cls;
    b.textContent = label;
    b.addEventListener('click', onClick);
    return b;
  }

  function showMessage(title, desc, tone, actions) {
    overlayTitle.textContent = title;
    overlayTitle.className = 'title' + (tone ? ' is-' + tone : '');
    overlayDesc.innerHTML = desc || '';
    overlayDesc.hidden = !desc;
    choicesEl.hidden = true;
    choicesEl.className = 'choices';
    choicesEl.textContent = '';
    actionsEl.hidden = false;
    actionsEl.textContent = '';
    actions.forEach(function (a) { actionsEl.appendChild(button(a[0], a[1], a[2])); });
    overlay.hidden = false;
  }

  function readyScreen() {
    state = 'ready';
    buildStage();
    quizEl.textContent = currentGate().text;
    showMessage(
      unitLabel(sel) + ' · 스테이지 ' + stageNo,
      '갈림길에서 <b>정답이 적힌 길</b>로 들어가세요.<br>' +
      '길이 끊긴 곳은 <b>↑</b> 로 뛰어넘고,<br>금 간 타일은 밟으면 무너집니다.',
      null,
      [['go', 'Start', start], ['sub', '단원 바꾸기', openMenu]]
    );
  }

  function start() {
    state = 'playing';
    overlay.hidden = true;
    lastTime = 0;
    requestAnimationFrame(loop);
  }

  function pauseScreen() {
    state = 'paused';
    showMessage('일시정지', '<b>P</b> 를 눌러 이어서 갑니다.', null,
      [['go', 'Resume', togglePause], ['sub', '단원 바꾸기', openMenu]]);
  }

  function togglePause() {
    if (state === 'playing') {
      pauseScreen();
    } else if (state === 'paused') {
      state = 'playing';
      overlay.hidden = true;
      lastTime = 0;
      requestAnimationFrame(loop);
    }
  }

  function retryStage() {
    buildStage();
    quizEl.textContent = currentGate().text;
    start();
  }

  function fail(title, desc) {
    state = 'over';
    flash = { t: 0.5, bad: true };
    draw();
    showMessage(title, desc + '<br>스테이지 <b>' + stageNo + '</b> 을 처음부터 다시 갑니다.', 'bad',
      [['go', 'Retry', retryStage], ['sub', '단원 바꾸기', openMenu]]);
  }

  function clearStage() {
    var doneAll = stageNo >= STAGE_COUNT;

    if (stageNo > best) {
      best = stageNo;
      try { localStorage.setItem(BEST_KEY + '.' + unitId(sel), String(best)); } catch (e) { /* 저장 불가 환경 무시 */ }
    }

    if (doneAll) {
      state = 'cleared';
      tickets += 1;                     // 스테이지를 모두 끝냈으니 상점에서 옷 한 벌을 고를 수 있다
      saveCloset();
      updateHud();
      showMessage(
        '단원 완주!',
        unitLabel(sel) + ' 의 스테이지 ' + STAGE_COUNT + '개를 모두 끝냈습니다.<br>' +
        '<b>상점에서 옷 한 벌</b>을 고를 수 있어요.',
        'good',
        [['go', '상점 열기', openShop], ['sub', '처음부터', function () { stageNo = 1; speed = pace.speed; readyScreen(); }],
         ['sub', '단원 바꾸기', openMenu]]
      );
      return;
    }

    state = 'cleared';
    stageNo += 1;
    speed = Math.min(pace.max, speed + pace.gain * 4);
    updateHud();
    showMessage('스테이지 ' + (stageNo - 1) + ' 클리어', '무지개 계단을 올라 <b>스테이지 ' + stageNo + '</b> 로 갑니다.', 'good',
      [['go', 'Next', function () { buildStage(); quizEl.textContent = currentGate().text; start(); }],
       ['sub', '단원 바꾸기', openMenu]]);
  }

  // ── 단원 고르기 ──────────────────────────────
  var menuStep = 'school', menuSel = {};

  function openMenu() {
    state = 'menu';
    menuStep = 'school';
    menuSel = {};
    drawMenu();
  }

  function drawMenu() {
    var items = [], title = '', back = null;

    if (menuStep === 'school') {
      title = '어디까지 배웠나요?';
      items = SCHOOLS.map(function (s) {
        return [null, s.label, function () {
          menuSel = { school: s.key };
          menuStep = s.units ? 'unit' : 'grade';
          drawMenu();
        }];
      });
    } else if (menuStep === 'grade') {
      var s1 = schoolOf(menuSel.school);
      title = s1.label;
      back = function () { menuStep = 'school'; drawMenu(); };
      items = s1.grades.map(function (g) {
        return [null, g + '학년', function () { menuSel.grade = g; menuStep = 'term'; drawMenu(); }];
      });
    } else if (menuStep === 'term') {
      var s2 = schoolOf(menuSel.school);
      title = s2.label + ' ' + menuSel.grade + '학년';
      back = function () { menuStep = 'grade'; drawMenu(); };
      items = s2.terms.map(function (t) {
        return [null, t + '학기', function () { menuSel.term = t; menuStep = 'unit'; drawMenu(); }];
      });
    } else {
      var s3 = schoolOf(menuSel.school);
      title = s3.units ? s3.label : s3.label + ' ' + menuSel.grade + '학년 ' + menuSel.term + '학기';
      back = function () { menuStep = s3.units ? 'school' : 'term'; drawMenu(); };
      items = unitsOf(menuSel).map(function (u, i) {
        return [i + 1, u[0], function () {
          chooseUnit({ school: menuSel.school, grade: menuSel.grade, term: menuSel.term, unit: i });
        }];
      });
    }

    overlayTitle.textContent = title;
    overlayTitle.className = 'title';
    overlayDesc.hidden = true;
    choicesEl.className = 'choices';
    choicesEl.hidden = false;
    choicesEl.textContent = '';

    items.forEach(function (it) {
      var b = document.createElement('button');
      if (it[0] != null) {
        var no = document.createElement('span');
        no.className = 'no';
        no.textContent = it[0];
        b.appendChild(no);
      }
      b.appendChild(document.createTextNode(it[1]));
      b.addEventListener('click', it[2]);
      choicesEl.appendChild(b);
    });

    actionsEl.textContent = '';
    if (back) actionsEl.appendChild(button('sub', '← 뒤로', back));
    if (sel) actionsEl.appendChild(button('sub', '취소', readyScreen));
    actionsEl.hidden = !actionsEl.childNodes.length;
    overlay.hidden = false;
  }

  // ── 상점 ─────────────────────────────────────
  var backFromShop = null;

  function openShop() {
    if (state !== 'shop') backFromShop = state;
    state = 'shop';

    overlayTitle.textContent = '상점';
    overlayTitle.className = 'title';
    overlayDesc.innerHTML = tickets > 0
      ? '고를 수 있는 옷 <b>' + tickets + '</b>벌.<br>가진 옷은 눌러서 갈아입습니다.'
      : '스테이지 <b>' + STAGE_COUNT + '개</b>를 모두 끝내면<br>옷을 한 벌 고를 수 있어요.';
    overlayDesc.hidden = false;
    choicesEl.className = 'choices wardrobe';
    choicesEl.hidden = false;
    choicesEl.textContent = '';

    CLOTHES.forEach(function (c) {
      var have = owned.indexOf(c.id) >= 0;
      var b = document.createElement('button');
      b.className = have ? (wearing === c.id ? 'is-worn' : '') : 'is-locked';

      var pv = document.createElement('canvas');
      pv.width = 68; pv.height = 84;
      var g = pv.getContext('2d');
      g.setTransform(2, 0, 0, 2, 0, 0);
      drawAvatar(g, 17, 38, 1.05, c, 0);
      b.appendChild(pv);

      b.appendChild(document.createTextNode(have ? (wearing === c.id ? '입는 중' : c.name) : c.name));
      b.title = c.name;

      b.addEventListener('click', function () {
        if (have) { wearing = c.id; }
        else if (tickets > 0) { tickets -= 1; owned.push(c.id); wearing = c.id; }
        else return;
        saveCloset();
        updateHud();
        openShop();
      });

      choicesEl.appendChild(b);
    });

    actionsEl.textContent = '';
    actionsEl.appendChild(button('go', '닫기', function () {
      var back = backFromShop;
      backFromShop = null;
      if (!sel || back === 'menu') { openMenu(); return; }
      // 판을 보다 들른 것이면 그 자리로 돌려보낸다 — 상점에 다녀왔다고 판을 처음부터 다시 하게 두지 않는다
      if (back === 'paused' || back === 'playing') { pauseScreen(); return; }
      if (back === 'cleared') { stageNo = 1; speed = pace.speed; }
      readyScreen();
    }));
    actionsEl.hidden = false;
    overlay.hidden = false;
  }

  // ══ 한 걸음 ═══════════════════════════════════
  function update(dt) {
    dist += speed * dt;

    if (jump) {
      jump.t += dt;
      if (jump.t >= JUMP_DUR) jump = null;
    }

    // 금 간 타일은 밟는 순간부터 시간을 재고, 3초에 한 칸씩 무너진다
    cracks.forEach(function (c) {
      if (c.t === null) {
        if (dist >= c.y0 && dist <= c.y0 + c.n * TILE) c.t = 0;
      } else if (c.t < CRUMBLE_EVERY * c.n + 1) {
        c.t += dt;
      }
    });

    if (!jump && overHole(dist)) {
      fail('길이 끊겼습니다', '끊긴 자리에서는 <b>↑</b> 로 뛰어야 합니다.');
      return;
    }

    var gate = currentGate();
    if (gate) {
      // 갈림길에 들어서는 순간 길이 정해진다. 그 뒤로는 분리대에 막혀 바꿀 수 없다
      if (!locked && dist >= gate.y - FORK_LEN) {
        locked = true;
        lockedLane = lane;
      }

      if (dist >= gate.y) {
        gate.done = true;
        if (lockedLane === gate.side) {
          passed += 1;
          speed = Math.min(pace.max, speed + pace.gain);
          flash = { t: 0.3, bad: false };
          updateHud();
        } else {
          fail('틀렸습니다', '<b>' + gate.text + '</b> 의 답은 <b>' + gate.answer + '</b>.');
          return;
        }
      }
    }

    var last = null;
    for (var i = 0; i < gates.length; i++) if (gates[i].done) last = gates[i];
    if (locked && (!last || dist >= last.y + MEDIAN_TAIL)) locked = false;
    if (locked) lane = lockedLane;

    playerX += (LANE_X[lane] - playerX) * Math.min(1, dt * 9);

    if (flash) { flash.t -= dt; if (flash.t <= 0) flash = null; }

    // 네 문제를 다 지나면 남은 길은 계단뿐이니, 지나간 문제를 계속 띄워 두지 않는다
    var next = currentGate();
    var ask = next ? next.text : '무지개 계단으로 →';
    if (quizEl.textContent !== ask) quizEl.textContent = ask;

    if (dist >= stairsY + STAIRS_STEP * RAINBOW.length + 26) { clearStage(); return; }
  }

  // ══ 그리기 ════════════════════════════════════
  function sy(worldY) { return PLAYER_Y - (worldY - dist); }

  function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  // 단원마다 문제의 길이가 제각각이라, 표지판 폭에 맞을 때까지 글자를 줄인다
  function fitFont(g, text, maxWidth, start, min) {
    var size = start;
    do {
      g.font = 'bold ' + size + 'px ' + FONT;
      if (g.measureText(text).width <= maxWidth) break;
      size -= 1;
    } while (size > min);
    return size;
  }

  function drawFloor() {
    ctx.fillStyle = '#0b0c10';
    ctx.fillRect(0, 0, W, H);

    var r0 = Math.floor((dist - (H - PLAYER_Y)) / TILE) - 1;
    var r1 = Math.floor((dist + SEE_AHEAD) / TILE) + 1;

    for (var r = r0; r <= r1; r++) {
      var top = sy((r + 1) * TILE);
      if (top > H || top + TILE < 0) continue;
      for (var c = 0; c < COLS; c++) {
        ctx.drawImage(plateAt(c, r), ROAD_L + c * TILE, top, TILE, TILE);
      }
    }
  }

  function drawHole(y0, y1, mark) {
    var top = sy(y1), bottom = sy(y0);
    if (bottom < -10 || top > H + 10) return;

    var x = ROAD_L, w = ROAD_R - ROAD_L;

    ctx.fillStyle = '#05060a';
    ctx.fillRect(x, top, w, bottom - top);

    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(x, top, w, 4);
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.fillRect(x, bottom - 3, w, 3);

    // 뛰라는 표시 — 구멍 앞쪽 바닥에 새겨 둔다
    if (mark && bottom < H + 40) {
      ctx.strokeStyle = '#ffd48a';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      for (var i = 0; i < 2; i++) {
        var cy = bottom + 12 + i * 9;
        ctx.beginPath();
        ctx.moveTo(CENTER - 11, cy + 5);
        ctx.lineTo(CENTER, cy);
        ctx.lineTo(CENTER + 11, cy + 5);
        ctx.stroke();
      }
      ctx.lineCap = 'butt';
    }
  }

  function drawCracks() {
    cracks.forEach(function (c) {
      for (var k = 0; k < c.n; k++) {
        var y0 = c.y0 + k * TILE;
        if (fallen(c, k)) { drawHole(y0, y0 + TILE, false); continue; }

        var top = sy(y0 + TILE);
        if (top > H || top + TILE < 0) continue;

        // 곧 무너질 칸은 잘게 떨린다
        var due = c.t !== null ? CRUMBLE_EVERY * (k + 1) - c.t : 99;
        var jx = due < 0.7 ? (Math.random() - 0.5) * 2 : 0;

        ctx.save();
        ctx.globalAlpha = due < 0.7 ? 0.72 : 1;

        // 같은 블록이되 빛이 바래고 금이 간 것으로 — 밟으면 안 된다는 것이 한눈에 보이게
        ctx.fillStyle = '#b3ada0';
        ctx.fillRect(ROAD_L + jx, top, ROAD_R - ROAD_L, TILE);

        ctx.fillStyle = '#c2bcb0';
        for (var i = 0; i < COLS; i++) {
          ctx.beginPath();
          ctx.arc(ROAD_L + i * TILE + TILE / 2 + jx, top + TILE / 2, 6, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.strokeStyle = '#6e6659';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (i = 0; i < COLS; i++) {
          var x = ROAD_L + i * TILE + jx;
          ctx.moveTo(x, top + TILE * 0.2);
          ctx.lineTo(x + TILE * 0.42, top + TILE * 0.55);
          ctx.lineTo(x + TILE * 0.3, top + TILE);
          ctx.moveTo(x + TILE * 0.42, top + TILE * 0.55);
          ctx.lineTo(x + TILE, top + TILE * 0.35);
        }
        ctx.stroke();
        ctx.restore();
      }
    });
  }

  function drawStairs() {
    var base = stairsY;
    for (var i = 0; i < RAINBOW.length; i++) {
      var y0 = base + i * STAIRS_STEP;
      var top = sy(y0 + STAIRS_STEP);
      if (top > H || top + STAIRS_STEP < 0) continue;

      ctx.fillStyle = RAINBOW[i];
      ctx.fillRect(ROAD_L, top, ROAD_R - ROAD_L, STAIRS_STEP);
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.fillRect(ROAD_L, top, ROAD_R - ROAD_L, 3);
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.fillRect(ROAD_L, top + STAIRS_STEP - 2, ROAD_R - ROAD_L, 2);
    }
  }

  function drawBrickWall(x, top, w, h) {
    if (h <= 0) return;
    ctx.fillStyle = '#5d6472';
    ctx.fillRect(x, top, w, h);
    ctx.fillStyle = '#767e8e';
    ctx.fillRect(x, top, w, Math.min(4, h));
    ctx.strokeStyle = '#3d4350';
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, top + 1, w - 2, h - 2);

    ctx.fillStyle = '#6b7382';
    for (var y = top + 8; y < top + h - 6; y += 18) {
      for (var i = 0; i < 2; i++) {
        ctx.beginPath();
        ctx.arc(x + w * (i ? 0.72 : 0.28), y, 5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawGate(gate) {
    var forkStart = gate.y - FORK_LEN;
    var top = sy(gate.y + MEDIAN_TAIL);
    var bottom = sy(forkStart);
    if (bottom < 0 || top > H) return;

    drawBrickWall(MEDIAN_L, top, MEDIAN_W, bottom - top);

    // 각 길에 놓인 답 블록
    var ay = sy(gate.y - 60);
    if (ay > -40 && ay < H + 40) {
      [-1, 1].forEach(function (side) {
        var value = side === -1 ? gate.left : gate.right;
        var cx = LANE_X[side];
        var right = gate.done && side === gate.side;
        var wrong = gate.done && side !== gate.side;

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        fitFont(ctx, value, 104, 26, 12);
        var w = Math.max(72, ctx.measureText(value).width + 26);

        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        roundRect(ctx, cx - w / 2, ay - 18, w, 44, 7); ctx.fill();

        roundRect(ctx, cx - w / 2, ay - 22, w, 44, 7);
        ctx.fillStyle = right ? '#6fd08c' : (wrong ? '#7a7f8b' : '#f4f1e6');
        ctx.fill();
        ctx.strokeStyle = right ? '#4aa96a' : (wrong ? '#5d6270' : '#c9c4b4');
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#1a1d24';
        ctx.fillText(value, cx, ay + 1);
      });
    }

    // 갈림길 앞 표지판
    if (!gate.done) {
      var qy = sy(forkStart - QUESTION_BACK);
      if (qy > -30 && qy < H + 30) {
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        var size = fitFont(ctx, gate.text, 262, 22, 10);
        var tw = ctx.measureText(gate.text).width;
        var bw = Math.min(tw + 26, ROAD_R - ROAD_L - 8), bh = size + 18;

        ctx.fillStyle = '#3b3026';
        ctx.fillRect(CENTER - 3, qy - 2, 6, bh / 2 + 12);

        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        roundRect(ctx, CENTER - bw / 2 + 2, qy - bh / 2 + 3, bw, bh, 5); ctx.fill();

        roundRect(ctx, CENTER - bw / 2, qy - bh / 2, bw, bh, 5);
        ctx.fillStyle = '#1c2230';
        ctx.fill();
        ctx.strokeStyle = '#ffd48a';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.fillText(gate.text, CENTER, qy + 1);
      }
    }

    // 관문 선
    var gy = sy(gate.y);
    if (gy > -10 && gy < H + 10) {
      ctx.strokeStyle = gate.done ? 'rgba(255,255,255,0.25)' : '#ffd48a';
      ctx.lineWidth = 3;
      ctx.setLineDash([9, 7]);
      ctx.beginPath();
      ctx.moveTo(ROAD_L, gy);   ctx.lineTo(MEDIAN_L, gy);
      ctx.moveTo(MEDIAN_R, gy); ctx.lineTo(ROAD_R, gy);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // ── 아바타 ───────────────────────────────────
  function drawAvatar(g, x, groundY, s, cloth, lift) {
    var y = groundY - lift;

    // 그림자는 땅에 남는다 — 뛴 높이만큼 작아진다
    g.save();
    g.fillStyle = 'rgba(0,0,0,' + (0.38 - lift * 0.006).toFixed(3) + ')';
    g.beginPath();
    g.ellipse(x, groundY + 2 * s, (9 - lift * 0.08) * s, (3.4 - lift * 0.03) * s, 0, 0, Math.PI * 2);
    g.fill();
    g.restore();

    if (cloth.cape) {                    // 무지개 망토는 몸 뒤에 먼저 깔린다 — 어깨에서 아래로 벌어진다
      for (var i = 0; i < RAINBOW.length; i++) {
        var t0 = -7 + i * 2, t1 = -10.5 + i * 3;
        g.fillStyle = RAINBOW[i];
        g.beginPath();
        g.moveTo(x + t0 * s, y - 21 * s);
        g.lineTo(x + (t0 + 2) * s, y - 21 * s);
        g.lineTo(x + (t1 + 3) * s, y - 4 * s);
        g.lineTo(x + t1 * s, y - 4 * s);
        g.closePath();
        g.fill();
      }
    }

    if (cloth.skirt) {
      g.fillStyle = cloth.pants;
      g.beginPath();
      g.moveTo(x - 5 * s, y - 12 * s);
      g.lineTo(x + 5 * s, y - 12 * s);
      g.lineTo(x + 9 * s, y - 1 * s);
      g.lineTo(x - 9 * s, y - 1 * s);
      g.closePath();
      g.fill();
    } else {
      g.fillStyle = cloth.pants;
      g.fillRect(x - 5.5 * s, y - 9 * s, 4.5 * s, 8 * s);
      g.fillRect(x + 1 * s, y - 9 * s, 4.5 * s, 8 * s);
      g.fillStyle = '#22252d';
      g.fillRect(x - 6 * s, y - 2 * s, 5 * s, 2 * s);
      g.fillRect(x + 1 * s, y - 2 * s, 5 * s, 2 * s);
    }

    g.fillStyle = cloth.arm;             // 팔
    g.fillRect(x - 10 * s, y - 20 * s, 3 * s, 10 * s);
    g.fillRect(x + 7 * s, y - 20 * s, 3 * s, 10 * s);
    g.fillStyle = SKIN;
    g.fillRect(x - 10 * s, y - 11 * s, 3 * s, 2.6 * s);
    g.fillRect(x + 7 * s, y - 11 * s, 3 * s, 2.6 * s);

    g.fillStyle = cloth.shirt;           // 몸통
    roundRect(g, x - 7.5 * s, y - 21 * s, 15 * s, 12.5 * s, 3 * s);
    g.fill();
    g.strokeStyle = OUTLINE;             // 색색의 바닥 위에서도 실루엣이 살도록 테두리를 두른다
    g.lineWidth = 1.1 * s;
    g.stroke();

    var hx = x, hy = y - 27 * s, hr = 6.6 * s;

    g.fillStyle = SKIN;                  // 머리
    g.beginPath(); g.arc(hx, hy, hr, 0, Math.PI * 2); g.fill();
    g.strokeStyle = OUTLINE;
    g.lineWidth = 1.1 * s;
    g.stroke();
    g.fillStyle = SKIN_DARK;
    g.fillRect(x - 2.2 * s, y - 22.5 * s, 4.4 * s, 2 * s);

    if (cloth.mask) {
      g.fillStyle = cloth.shirt;
      g.beginPath(); g.arc(hx, hy, hr + 0.4 * s, Math.PI, Math.PI * 2); g.fill();
      g.fillRect(hx - hr, hy + 1.6 * s, hr * 2, hr - 1.6 * s);
      g.fillStyle = SKIN;
      g.fillRect(hx - hr, hy - 0.6 * s, hr * 2, 2.4 * s);
    } else if (cloth.helmet) {
      g.strokeStyle = '#dfe7f2';
      g.lineWidth = 1.6 * s;
      g.beginPath(); g.arc(hx, hy - 0.4 * s, hr + 1.8 * s, 0, Math.PI * 2); g.stroke();
      g.fillStyle = 'rgba(180, 220, 255, 0.25)';
      g.beginPath(); g.arc(hx, hy - 0.4 * s, hr + 1.8 * s, 0, Math.PI * 2); g.fill();
    } else if (cloth.hood) {
      g.fillStyle = cloth.shirt;
      g.beginPath(); g.arc(hx, hy - 0.6 * s, hr + 1.6 * s, Math.PI, Math.PI * 2); g.fill();
      g.fillRect(hx - hr - 1.6 * s, hy - 0.6 * s, (hr + 1.6 * s) * 2, 2 * s);
    } else if (cloth.hat) {
      g.fillStyle = cloth.pants;
      g.beginPath();
      g.moveTo(hx, hy - 15 * s);
      g.lineTo(hx + 8 * s, hy - 4 * s);
      g.lineTo(hx - 8 * s, hy - 4 * s);
      g.closePath(); g.fill();
      g.fillStyle = '#f7cf3f';
      g.fillRect(hx - 8 * s, hy - 5 * s, 16 * s, 2 * s);
    } else {
      g.fillStyle = HAIR;                // 기본 머리카락
      g.beginPath(); g.arc(hx, hy - 1 * s, hr, Math.PI, Math.PI * 2); g.fill();
      g.fillRect(hx - hr, hy - 1.6 * s, hr * 2, 1.8 * s);
    }

    if (cloth.crown) {
      g.fillStyle = '#f7cf3f';
      g.beginPath();
      g.moveTo(hx - 5 * s, hy - 5.5 * s);
      g.lineTo(hx - 5 * s, hy - 10 * s);
      g.lineTo(hx - 2 * s, hy - 7.5 * s);
      g.lineTo(hx, hy - 11 * s);
      g.lineTo(hx + 2 * s, hy - 7.5 * s);
      g.lineTo(hx + 5 * s, hy - 10 * s);
      g.lineTo(hx + 5 * s, hy - 5.5 * s);
      g.closePath(); g.fill();
    }

    if (!cloth.mask) {                   // 눈
      g.fillStyle = '#2b2119';
      g.beginPath(); g.arc(hx - 2.4 * s, hy + 0.4 * s, 0.95 * s, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(hx + 2.4 * s, hy + 0.4 * s, 0.95 * s, 0, Math.PI * 2); g.fill();
    }
  }

  function draw() {
    drawFloor();
    holes.forEach(function (h) { drawHole(h.y0, h.y1, true); });
    drawCracks();
    drawStairs();
    gates.forEach(drawGate);

    var lift = jump ? Math.sin(Math.PI * jump.t / JUMP_DUR) * JUMP_HIGH : 0;
    drawAvatar(ctx, playerX, PLAYER_Y, 1, clothOf(wearing), lift);

    if (flash) {
      var a = Math.max(0, flash.t) * (flash.bad ? 0.5 : 0.3);
      ctx.fillStyle = (flash.bad ? 'rgba(255, 106, 77,' : 'rgba(111, 208, 140,') + a + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  function loop(now) {
    if (state !== 'playing') return;

    if (!lastTime) lastTime = now;
    var dt = Math.min(0.05, (now - lastTime) / 1000);   // 탭을 다시 열었을 때 한 번에 튀지 않게 자른다
    lastTime = now;

    update(dt);
    draw();

    if (state === 'playing') requestAnimationFrame(loop);
  }

  // ══ 입력 ══════════════════════════════════════
  function steer(side) {
    if (state !== 'playing' || locked) return;
    lane = side;
  }

  function doJump() {
    if (state !== 'playing' || jump) return;
    jump = { t: 0 };
  }

  document.addEventListener('keydown', function (e) {
    switch (e.key) {
      case 'ArrowLeft': case 'a': case 'A':
        steer(-1); e.preventDefault(); break;
      case 'ArrowRight': case 'd': case 'D':
        steer(1); e.preventDefault(); break;
      case 'ArrowUp': case 'w': case 'W':
        doJump(); e.preventDefault(); break;
      case ' ':
        if (state === 'playing') doJump();
        else if (state === 'ready') start();
        else if (state === 'over') retryStage();
        else if (state === 'paused') togglePause();
        e.preventDefault();
        break;
      case 'Enter':
        if (state === 'ready') start();
        else if (state === 'over') retryStage();
        else if (state === 'paused') togglePause();
        e.preventDefault();
        break;
      case 'p': case 'P':
        if (state === 'playing' || state === 'paused') togglePause();
        break;
      case 'r': case 'R':
        if (sel && state !== 'menu' && state !== 'shop') readyScreen();
        break;
      case 'Escape':
        if (state !== 'menu') openMenu();
        break;
    }
  });

  pads.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    if (btn.dataset.act === 'jump') doJump();
    else steer(Number(btn.dataset.side));
  });

  // 화면을 눌러도 조작할 수 있다 — 좌우 절반은 길 고르기, 아바타 언저리는 점프
  canvas.addEventListener('pointerdown', function (e) {
    if (state !== 'playing') return;
    var r = canvas.getBoundingClientRect();
    var y = (e.clientY - r.top) / r.height * H;
    if (y > PLAYER_Y - 40) doJump();
    else steer((e.clientX - r.left) < r.width / 2 ? -1 : 1);
  });

  shopBtn.addEventListener('click', function () {
    if (state === 'playing') togglePause();
    openShop();
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && state === 'playing') togglePause();
  });

  // ══ 시작 ══════════════════════════════════════
  loadCloset();
  stageNo = 1;
  updateHud();

  (function boot() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(SEL_KEY) || 'null'); } catch (e) { /* 저장 불가 환경 무시 */ }

    if (saved && saved.school && schoolOf(saved.school)) {
      var list = null;
      try { list = unitsOf(saved); } catch (e) { list = null; }
      if (list && list[saved.unit]) { chooseUnit(saved); return; }
    }
    openMenu();
  })();
})();
</script>
</body>
</html>
