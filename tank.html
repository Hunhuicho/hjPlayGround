<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>탱크 — 방향키 미니게임</title>
<style>
  /* 만화풍 컬러 전장. 화면 자체가 하나의 사물이므로 단일 테마로 확정하고 모든 색을 명시한다. */
  :root {
    --case:        #171b20;
    --case-face:   #262c33;
    --case-edge:   #3a424c;
    --case-shadow: #0b0e11;
    --case-text:   #aab3be;
    --ground:      #cbb98d;
    --blue:        #4aa8e0;
    --orange:      #e08a4a;
    --panel:       rgba(21, 25, 30, 0.88);
    --panel-text:  #f2f5f8;
    --panel-dim:   #b6bfca;
    --key:         #1b2027;
    --key-face:    #333b45;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    background: var(--case);
    color: var(--case-text);
    font-family: var(--mono);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }

  .device {
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 22px;
    border-radius: 18px;
    background: var(--case-face);
    border: 1px solid var(--case-edge);
    box-shadow: 0 1px 0 var(--case-edge) inset, 0 18px 40px -18px var(--case-shadow);
  }

  .brand {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--case-text);
  }

  .brand .model { letter-spacing: 0.14em; opacity: 0.7; }

  .screen {
    padding: 12px;
    border-radius: 8px;
    background: var(--case-shadow);
    box-shadow: 0 2px 10px var(--case-shadow) inset;
  }

  .readout {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 0 2px 10px;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--case-text);
  }

  .readout b {
    margin-left: 8px;
    font-size: 17px;
    letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums;
    color: var(--panel-text);
  }

  .stage {
    position: relative;
    width: min(78vw, 62vh, 380px);
    aspect-ratio: 1;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 4px;
    background: var(--ground);
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 18px;
    text-align: center;
    border-radius: 4px;
    background: var(--panel);
    color: var(--panel-dim);
  }

  .overlay[hidden] { display: none; }

  .overlay .title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    text-wrap: balance;
    color: var(--panel-text);
  }

  .overlay .desc { font-size: 12.5px; line-height: 1.8; }

  .overlay .desc b {
    color: var(--blue);
    font-variant-numeric: tabular-nums;
  }

  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: 5px;
  }

  button:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 2px;
  }

  .levels {
    display: flex;
    gap: 6px;
    margin-top: 2px;
  }

  .levels[hidden] { display: none; }   /* display:flex 가 hidden 속성을 덮어쓰지 않도록 */

  .levels .level {
    padding: 7px 16px;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--panel-dim);
    background: transparent;
    box-shadow: 0 0 0 1px var(--case-edge) inset;
  }

  .levels .level.is-on {
    color: #06263a;
    background: var(--blue);
    box-shadow: none;
  }

  #start-btn {
    margin-top: 2px;
    padding: 10px 22px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #06263a;
    background: var(--blue);
  }

  #start-btn:hover { filter: brightness(1.08); }
  #start-btn:active { transform: translateY(1px); }

  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }

  .legend {
    margin: 0;
    font-size: 11px;
    line-height: 2;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--case-text);
  }

  .legend b { color: var(--blue); font-weight: 700; }

  .pad {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: none;
  }

  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 38px);
    grid-template-rows: repeat(3, 38px);
    gap: 4px;
  }

  .pad button {
    background: var(--key-face);
    color: var(--panel-text);
    font-size: 13px;
    line-height: 1;
    box-shadow: 0 2px 0 var(--key);
  }

  .pad button:active { transform: translateY(2px); box-shadow: none; }

  .dpad .up    { grid-area: 1 / 2; }
  .dpad .left  { grid-area: 2 / 1; }
  .dpad .down  { grid-area: 3 / 2; }
  .dpad .right { grid-area: 2 / 3; }

  /* 발사는 이동과 성격이 다른 동작이므로 십자키에서 떼어 원형 버튼으로 둔다 */
  .fire {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: #2a1206;
    background: var(--orange);
    box-shadow: 0 3px 0 #8a4f22;
  }

  .fire:active { transform: translateY(3px); box-shadow: none; }

  @media (prefers-reduced-motion: reduce) {
    button:active { transform: none; }
  }
</style>
</head>
<body>
  <div class="device">
    <div class="brand">
      <span>Tank</span>
      <span class="model">hjPlayGround</span>
    </div>

    <div class="screen">
      <div class="readout">
        <span>Score <b id="score">0</b></span>
        <span>Life <b id="life">0</b></span>
        <span>Left <b id="left">0</b></span>
      </div>

      <div class="stage">
        <canvas id="board" width="512" height="512"></canvas>
        <div class="overlay" id="overlay">
          <div class="title" id="overlay-title">Ready</div>
          <div class="desc" id="overlay-desc"></div>
          <div class="levels" id="levels" role="group" aria-label="난이도">
            <button class="level is-on" data-level="easy" aria-pressed="true">쉬움</button>
            <button class="level" data-level="normal" aria-pressed="false">보통</button>
          </div>
          <div class="levels" id="views" role="group" aria-label="시점">
            <button class="level is-on" data-view="fpv" aria-pressed="true">운전석</button>
            <button class="level" data-view="top" aria-pressed="false">위에서</button>
          </div>
          <button id="start-btn">Start</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <p class="legend">
        <b>← ↑ ↓ →</b> 이동<br>
        <b>Space</b> 발사 · <b>P</b> 일시정지 · <b>R</b> 다시 시작
      </p>
      <div class="pad">
        <div class="dpad">
          <button class="up"    data-dir="up"    aria-label="위쪽으로 이동">▲</button>
          <button class="left"  data-dir="left"  aria-label="왼쪽으로 이동">◀</button>
          <button class="down"  data-dir="down"  aria-label="아래쪽으로 이동">▼</button>
          <button class="right" data-dir="right" aria-label="오른쪽으로 이동">▶</button>
        </div>
        <button class="fire" id="fire-btn" aria-label="발사">FIRE</button>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');

  var TILE = 32;
  var COLS = canvas.width / TILE;     // 16 x 16
  var ROWS = canvas.height / TILE;
  var TANK = 27;                      // 타일보다 조금 작아 통로에서 걸리지 않는다
  var HALF = TANK / 2;

  var scoreEl = document.getElementById('score');
  var lifeEl = document.getElementById('life');
  var leftEl = document.getElementById('left');
  var overlay = document.getElementById('overlay');
  var overlayTitle = document.getElementById('overlay-title');
  var overlayDesc = document.getElementById('overlay-desc');
  var levelsEl = document.getElementById('levels');
  var viewsEl = document.getElementById('views');
  var startBtn = document.getElementById('start-btn');

  var C = {
    ground:     '#cbb98d',
    groundLine: '#c1ad7c',
    speck:      '#bda872',
    outline:    '#20262e',
    shadow:     'rgba(32, 38, 46, 0.22)',

    blue:       '#4aa8e0',
    blueDark:   '#2b7cb0',
    blueLight:  '#8fd0f2',
    red:        '#dd7048',
    redDark:    '#a94c2c',
    redLight:   '#f0a680',

    track:      '#39414b',
    wheel:      '#79838f',
    muzzle:     '#ff9d3d',

    wood:       '#a87844',
    woodDark:   '#7a5327',
    roof:       '#c05e3c',
    roofDark:   '#8d3f26',
    wall:       '#e6d3a8',
    rock:       '#98a0a8',
    rockLight:  '#bcc3c9'
  };

  // F = 담장(한 방에 무너짐), H = 막사(2x2 건물, 두 방), R = 바위(안 부서짐).
  // 탁 트인 전장에 물건을 띄엄띄엄 놓아 숨을 곳만 만든다.
  var MAP = [
    '................',
    '................',
    '..HH......HH....',
    '..HH......HH....',
    '................',
    '.FFFF......FFFF.',
    '................',
    '......RRRR......',
    '................',
    '.FFFF......FFFF.',
    '................',
    '....HH......HH..',
    '....HH......HH..',
    '................',
    '................',
    '................'
  ];

  var FENCE = 1, ROCK = 2, HUT = 3, HUT_HIT = 4;

  var LEVELS = {
    easy: {
      lives: 5, total: 8, maxAlive: 2,
      playerSpeed: 120, enemySpeed: 58,
      playerBullet: 245, enemyBullet: 155,
      playerReload: 380, enemyReload: 2000
    },
    normal: {
      lives: 3, total: 12, maxAlive: 3,
      playerSpeed: 154, enemySpeed: 92,
      playerBullet: 320, enemyBullet: 237,
      playerReload: 300, enemyReload: 1100
    }
  };

  var BEST_KEY = 'tank.best';
  var LEVEL_KEY = 'tank.level';
  var VIEW_KEY = 'tank.view';

  var DIRS = {
    up:    { x: 0,  y: -1 },
    down:  { x: 0,  y: 1  },
    left:  { x: -1, y: 0  },
    right: { x: 1,  y: 0  }
  };

  var ANGLE = { up: 0, right: Math.PI / 2, down: Math.PI, left: -Math.PI / 2 };

  var SPAWNS = [{ c: 0, r: 0 }, { c: 8, r: 0 }, { c: 15, r: 0 }];

  var levelName, level, view;
  var tiles, player, enemies, bullets;
  var score, lives, remaining, spawnQueue, spawnTimer, spawnIndex;
  var state, lastTime;
  var keys = {};

  // 흙바닥 얼룩은 한 번만 뽑아 두고 매 프레임 같은 자리에 찍는다
  var SPECKS = (function () {
    var out = [];
    for (var i = 0; i < 90; i++) {
      out.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: 1 + Math.random() * 2
      });
    }
    return out;
  })();

  // ── 지형 ──────────────────────────────────────

  function buildTiles() {
    tiles = [];
    for (var r = 0; r < ROWS; r++) {
      tiles[r] = [];
      for (var c = 0; c < COLS; c++) {
        var ch = MAP[r].charAt(c);
        tiles[r][c] = ch === 'F' ? FENCE : ch === 'R' ? ROCK : ch === 'H' ? HUT : 0;
      }
    }
  }

  function tileAt(r, c) {
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return ROCK;   // 화면 밖은 바위 취급
    return tiles[r][c];
  }

  function rectHitsWall(x, y, size) {
    var h = size / 2;
    if (x - h < 0 || y - h < 0 || x + h > canvas.width || y + h > canvas.height) return true;
    var c0 = Math.floor((x - h) / TILE), c1 = Math.floor((x + h - 0.001) / TILE);
    var r0 = Math.floor((y - h) / TILE), r1 = Math.floor((y + h - 0.001) / TILE);
    for (var r = r0; r <= r1; r++) {
      for (var c = c0; c <= c1; c++) {
        if (tileAt(r, c) !== 0) return true;
      }
    }
    return false;
  }

  function center(i) { return i * TILE + TILE / 2; }

  // ── 탱크 ──────────────────────────────────────

  function makeTank(c, r, dir, isPlayer) {
    return {
      x: center(c), y: center(r),
      dir: DIRS[dir], dirName: dir,
      isPlayer: isPlayer,
      reload: 0,
      think: 0,
      invuln: isPlayer ? 1500 : 0
    };
  }

  function tanksOverlap(t, x, y) {
    var list = [player].concat(enemies);
    for (var i = 0; i < list.length; i++) {
      var o = list[i];
      if (!o || o === t) continue;
      if (Math.abs(o.x - x) < TANK && Math.abs(o.y - y) < TANK) return true;
    }
    return false;
  }

  function face(t, name) {
    if (t.dirName === name) return;
    var horizontal = name === 'left' || name === 'right';
    var before = { x: t.x, y: t.y };
    // 방향을 꺾을 때 통로 한가운데로 맞춰 준다 — 모서리에 걸려 멈추는 일을 없앤다
    if (horizontal) t.y = center(Math.round((t.y - TILE / 2) / TILE));
    else t.x = center(Math.round((t.x - TILE / 2) / TILE));
    if (rectHitsWall(t.x, t.y, TANK)) { t.x = before.x; t.y = before.y; }
    t.dirName = name;
    t.dir = DIRS[name];
  }

  function moveTank(t, speed, dt) {
    var d = speed * dt / 1000;
    var nx = t.x + t.dir.x * d;
    var ny = t.y + t.dir.y * d;
    if (rectHitsWall(nx, ny, TANK) || tanksOverlap(t, nx, ny)) return false;
    t.x = nx;
    t.y = ny;
    return true;
  }

  function fire(t, speed) {
    if (t.reload > 0) return;
    t.reload = t.isPlayer ? level.playerReload : level.enemyReload;
    bullets.push({
      x: t.x + t.dir.x * (HALF + 6),
      y: t.y + t.dir.y * (HALF + 6),
      dx: t.dir.x * speed,
      dy: t.dir.y * speed,
      dirName: t.dirName,
      fromPlayer: t.isPlayer
    });
  }

  // ── 적 ────────────────────────────────────────

  var DIR_NAMES = ['up', 'down', 'left', 'right'];

  function updateEnemy(e, dt) {
    e.think -= dt;

    // 플레이어와 같은 줄에 서면 그쪽을 향해 쏜다
    var alignedX = Math.abs(e.x - player.x) < TILE * 0.6;
    var alignedY = Math.abs(e.y - player.y) < TILE * 0.6;
    if (alignedX || alignedY) {
      var want = alignedX ? (player.y > e.y ? 'down' : 'up') : (player.x > e.x ? 'right' : 'left');
      face(e, want);
      fire(e, level.enemyBullet);
    }

    if (!moveTank(e, level.enemySpeed, dt) || e.think <= 0) {
      // 절반은 플레이어 쪽으로, 절반은 아무 방향으로 — 몰려다니지도, 스폰에 갇히지도 않게
      if (Math.random() < 0.5) {
        var dx = player.x - e.x, dy = player.y - e.y;
        face(e, Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
      } else {
        face(e, DIR_NAMES[Math.floor(Math.random() * 4)]);
      }
      e.think = 600 + Math.random() * 1200;
    }
  }

  function trySpawn(dt) {
    if (spawnQueue <= 0 || enemies.length >= level.maxAlive) return;
    spawnTimer -= dt;
    if (spawnTimer > 0) return;
    spawnTimer = 1400;

    // 스폰 지점을 번갈아 쓴다 — 한쪽 구석에서만 나오면 한 방향만 지키면 되어 버린다
    for (var i = 0; i < SPAWNS.length; i++) {
      var sp = SPAWNS[(spawnIndex + i) % SPAWNS.length];
      var x = center(sp.c), y = center(sp.r);
      if (rectHitsWall(x, y, TANK) || tanksOverlap(null, x, y)) continue;
      enemies.push(makeTank(sp.c, sp.r, 'down', false));
      spawnIndex = (spawnIndex + i + 1) % SPAWNS.length;
      spawnQueue--;
      return;
    }
  }

  // ── 포탄 ──────────────────────────────────────

  function updateBullets(dt) {
    var playerHit = false;

    for (var i = bullets.length - 1; i >= 0; i--) {
      var b = bullets[i];
      b.x += b.dx * dt / 1000;
      b.y += b.dy * dt / 1000;

      if (b.x < 0 || b.y < 0 || b.x > canvas.width || b.y > canvas.height) {
        bullets.splice(i, 1);
        continue;
      }

      var r = Math.floor(b.y / TILE), c = Math.floor(b.x / TILE);
      var tile = tileAt(r, c);
      if (tile === FENCE || tile === HUT_HIT) {    // 담장, 그리고 이미 한 번 맞은 막사
        tiles[r][c] = 0;
        bullets.splice(i, 1);
        continue;
      }
      if (tile === HUT) { tiles[r][c] = HUT_HIT; bullets.splice(i, 1); continue; }
      if (tile === ROCK) { bullets.splice(i, 1); continue; }

      if (b.fromPlayer) {
        for (var e = 0; e < enemies.length; e++) {
          if (Math.abs(enemies[e].x - b.x) < HALF && Math.abs(enemies[e].y - b.y) < HALF) {
            enemies.splice(e, 1);
            bullets.splice(i, 1);
            remaining--;
            score += 100;
            scoreEl.textContent = score;
            leftEl.textContent = remaining;
            if (remaining <= 0) return win();
            break;
          }
        }
      } else if (player.invuln <= 0 && !playerHit &&
                 Math.abs(player.x - b.x) < HALF && Math.abs(player.y - b.y) < HALF) {
        bullets.splice(i, 1);
        playerHit = true;
      }
    }

    // 순회가 끝난 뒤에 처리한다 — hitPlayer 가 bullets 를 통째로 갈아 끼우기 때문
    if (playerHit) hitPlayer();
  }

  function hitPlayer() {
    lives--;
    lifeEl.textContent = lives;
    if (lives <= 0) return gameOver();
    player = makeTank(8, 14, 'up', true);
    bullets = bullets.filter(function (b) { return b.fromPlayer; });
  }

  // ── 그리기 ────────────────────────────────────

  function roundRectPath(x, y, w, h, r) {
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    roundRectPath(x, y, w, h, r);
  }

  function outlined(fill, lineWidth) {
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = C.outline;
    ctx.lineWidth = lineWidth || 2;
    ctx.stroke();
  }

  function drawGround() {
    ctx.fillStyle = C.ground;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = C.groundLine;
    ctx.lineWidth = 1;
    for (var i = 1; i < COLS; i++) {
      var p = i * TILE + 0.5;
      ctx.beginPath();
      ctx.moveTo(p, 0); ctx.lineTo(p, canvas.height);
      ctx.moveTo(0, p); ctx.lineTo(canvas.width, p);
      ctx.stroke();
    }

    ctx.fillStyle = C.speck;
    for (var s = 0; s < SPECKS.length; s++) {
      ctx.beginPath();
      ctx.arc(SPECKS[s].x, SPECKS[s].y, SPECKS[s].r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 담장 — 기둥 두 개에 가로대 두 줄
  function drawFence(x, y) {
    roundRect(x + 2, y + 9, TILE - 4, 5, 2);  outlined(C.wood, 1.5);
    roundRect(x + 2, y + 19, TILE - 4, 5, 2); outlined(C.wood, 1.5);
    roundRect(x + 5, y + 3, 6, TILE - 6, 2);  outlined(C.woodDark, 1.5);
    roundRect(x + TILE - 11, y + 3, 6, TILE - 6, 2); outlined(C.woodDark, 1.5);
  }

  // 막사 — 2x2 로 놓이므로 윗칸은 지붕, 아랫칸은 벽과 창문·문을 그린다
  function drawHut(x, y, r, c, damaged) {
    var above = tileAt(r - 1, c);
    var isRoof = above !== HUT && above !== HUT_HIT;

    if (isRoof) {
      ctx.fillStyle = C.roof;
      ctx.fillRect(x, y + 2, TILE, TILE - 2);
      ctx.fillStyle = C.roofDark;
      ctx.fillRect(x, y + TILE - 6, TILE, 6);          // 처마 그늘
      ctx.fillRect(x, y + 2, TILE, 3);                 // 용마루
    } else {
      ctx.fillStyle = C.wall;
      ctx.fillRect(x, y, TILE, TILE - 2);
      ctx.fillStyle = C.roofDark;
      ctx.fillRect(x, y, TILE, 3);                     // 지붕 아래 그늘
      ctx.fillStyle = C.woodDark;
      ctx.fillRect(x + 5, y + 8, 7, 7);                // 창
      ctx.fillRect(x + TILE - 12, y + 8, 7, 7);
      ctx.fillRect(x + TILE / 2 - 4, y + 19, 8, TILE - 21);   // 문
    }

    if (damaged) {
      // 한 번 맞으면 모서리가 뜯겨 나간다 — 다음 한 방에 무너진다
      ctx.fillStyle = C.ground;
      ctx.fillRect(x + TILE - 11, y, 11, 9);
      ctx.fillRect(x, y + TILE - 10, 8, 10);
      ctx.fillStyle = C.outline;
      ctx.fillRect(x + TILE - 11, y + 8, 11, 2);
      ctx.fillRect(x + 6, y + TILE - 10, 2, 10);
    }

    ctx.strokeStyle = C.outline;
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, TILE - 2, TILE - 2);
  }

  // 바위 — 모난 덩어리. 네모가 아니어서 부술 수 없는 것임을 모양으로 알린다
  function drawRock(x, y) {
    ctx.beginPath();
    ctx.moveTo(x + 10, y + 3);
    ctx.lineTo(x + TILE - 5, y + 7);
    ctx.lineTo(x + TILE - 2, y + 19);
    ctx.lineTo(x + TILE - 11, y + TILE - 2);
    ctx.lineTo(x + 5, y + TILE - 5);
    ctx.lineTo(x + 2, y + 11);
    ctx.closePath();
    outlined(C.rock, 2);

    ctx.beginPath();
    ctx.moveTo(x + 11, y + 7);
    ctx.lineTo(x + TILE - 9, y + 10);
    ctx.lineTo(x + TILE - 13, y + 15);
    ctx.lineTo(x + 9, y + 12);
    ctx.closePath();
    ctx.fillStyle = C.rockLight;
    ctx.fill();
  }

  function drawTiles() {
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var t = tiles[r][c];
        if (!t) continue;
        var x = c * TILE, y = r * TILE;
        if (t === FENCE) drawFence(x, y);
        else if (t === ROCK) drawRock(x, y);
        else drawHut(x, y, r, c, t === HUT_HIT);
      }
    }
  }

  // 위를 향한 모습으로 한 번만 그리고, 방향은 회전으로 처리한다
  function drawTank(t) {
    var body  = t.isPlayer ? C.blue : C.red;
    var dark  = t.isPlayer ? C.blueDark : C.redDark;
    var light = t.isPlayer ? C.blueLight : C.redLight;

    ctx.save();
    ctx.translate(t.x, t.y);

    ctx.fillStyle = C.shadow;
    ctx.beginPath();
    ctx.ellipse(2, 3, HALF, HALF - 1, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.rotate(ANGLE[t.dirName]);

    // 무한궤도 — 보기륜이 비치는 두 줄
    for (var side = -1; side <= 1; side += 2) {
      var tx = side * (HALF - 4) - 4;
      roundRect(tx, -HALF, 8, TANK, 3);
      outlined(C.track, 2);
      ctx.fillStyle = C.wheel;
      for (var w = -9; w <= 9; w += 6) {
        ctx.beginPath();
        ctx.arc(tx + 4, w, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 차체
    roundRect(-8, -12, 16, 24, 4);
    outlined(body, 2);
    ctx.fillStyle = light;
    roundRect(-5.5, -9, 4, 15, 2);
    ctx.fill();

    // 포탑과 큐폴라
    ctx.beginPath();
    ctx.arc(0, 2, 7.5, 0, Math.PI * 2);
    outlined(body, 2);
    ctx.beginPath();
    ctx.arc(-2.5, 0, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = light;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, 6, 3, 0, Math.PI * 2);
    outlined(dark, 1.5);

    // 포신과 주황 포구
    roundRect(-3, -(HALF + 11), 6, HALF + 13, 2);
    outlined(dark, 2);
    roundRect(-3.5, -(HALF + 12), 7, 5, 2);
    outlined(C.muzzle, 1.5);

    ctx.restore();
  }

  function drawBullet(b) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(ANGLE[b.dirName]);
    roundRect(-2.5, -6, 5, 12, 2.5);
    outlined(C.muzzle, 1.5);
    ctx.restore();
  }

  // ── 운전석 시점 ───────────────────────────────
  //
  // 세계는 그대로 2D 로 굴리고, 그리기만 카메라를 플레이어 탱크 안에 두어
  // 장애물과 적을 상자로 세워 그린다. 시점 방향은 늘 네 방향 중 하나다.

  var W = canvas.width, H = canvas.height;
  var HORIZON = H * 0.45;
  var FOCAL = W * 0.85;
  var EYE = 17;          // 운전석 눈높이 — 담장 너머는 보이고 막사는 못 넘는다
  var NEAR = 5;
  var FRAME = 22;        // 해치 테두리 두께

  var HEIGHT = { fence: 14, rock: 27, hut: 56, rubble: 22, edge: 46 };

  var cam = { x: 0, y: 0, fx: 0, fy: -1, rx: 1, ry: 0 };

  function shade(hex, k) {
    var n = parseInt(hex.slice(1), 16);
    return 'rgb(' + Math.min(255, Math.round(((n >> 16) & 255) * k)) + ',' +
                    Math.min(255, Math.round(((n >> 8) & 255) * k)) + ',' +
                    Math.min(255, Math.round((n & 255) * k)) + ')';
  }

  function P(wx, wy, h) {
    var dx = wx - cam.x, dy = wy - cam.y;
    return { X: dx * cam.rx + dy * cam.ry, Y: h - EYE, Z: dx * cam.fx + dy * cam.fy };
  }

  // 카메라 뒤로 넘어간 꼭짓점은 잘라 낸다 — 안 그러면 화면 밖으로 뒤집혀 그려진다
  function clipNear(poly) {
    var out = [];
    for (var i = 0; i < poly.length; i++) {
      var a = poly[i], b = poly[(i + 1) % poly.length];
      var ain = a.Z >= NEAR, bin = b.Z >= NEAR;
      if (ain) out.push(a);
      if (ain !== bin) {
        var t = (NEAR - a.Z) / (b.Z - a.Z);
        out.push({ X: a.X + (b.X - a.X) * t, Y: a.Y + (b.Y - a.Y) * t, Z: NEAR });
      }
    }
    return out;
  }

  function fillPoly(poly, fill) {
    var p = clipNear(poly);
    if (p.length < 3) return;
    ctx.beginPath();
    for (var i = 0; i < p.length; i++) {
      var sx = W / 2 + FOCAL * p[i].X / p[i].Z;
      var sy = HORIZON - FOCAL * p[i].Y / p[i].Z;
      if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = C.outline;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  function drawBox(x0, y0, x1, y1, h0, h1, base) {
    var side = shade(base, 0.82), top = shade(base, 1.14);
    // 카메라를 향한 면만 그린다 — 상자가 볼록해서 면끼리 겹칠 일이 없다
    if (cam.y < y0) fillPoly([P(x0, y0, h1), P(x1, y0, h1), P(x1, y0, h0), P(x0, y0, h0)], base);
    if (cam.y > y1) fillPoly([P(x1, y1, h1), P(x0, y1, h1), P(x0, y1, h0), P(x1, y1, h0)], base);
    if (cam.x < x0) fillPoly([P(x0, y1, h1), P(x0, y0, h1), P(x0, y0, h0), P(x0, y1, h0)], side);
    if (cam.x > x1) fillPoly([P(x1, y0, h1), P(x1, y1, h1), P(x1, y1, h0), P(x1, y0, h0)], side);
    if (EYE > h1)   fillPoly([P(x0, y0, h1), P(x1, y0, h1), P(x1, y1, h1), P(x0, y1, h1)], top);
  }

  // 임의의 볼록 다각형을 기둥으로 세운다 — 상자만으로는 경사 차체나 팔각 포탑을 못 만든다
  function drawPrism(pts, h0, h1, base) {
    var area = 0, i;
    for (i = 0; i < pts.length; i++) {
      var q = pts[(i + 1) % pts.length];
      area += pts[i].x * q.y - q.x * pts[i].y;
    }
    var wind = area > 0 ? 1 : -1;

    for (i = 0; i < pts.length; i++) {
      var a = pts[i], b = pts[(i + 1) % pts.length];
      var nx = (b.y - a.y) * wind, ny = -(b.x - a.x) * wind;
      if ((cam.x - a.x) * nx + (cam.y - a.y) * ny <= 0) continue;   // 뒷면은 건너뛴다
      var lean = Math.abs(nx) / (Math.abs(nx) + Math.abs(ny) || 1);
      fillPoly([P(a.x, a.y, h1), P(b.x, b.y, h1), P(b.x, b.y, h0), P(a.x, a.y, h0)],
               shade(base, 1 - 0.18 * lean));
    }

    if (EYE > h1) {
      var top = [];
      for (i = 0; i < pts.length; i++) top.push(P(pts[i].x, pts[i].y, h1));
      fillPoly(top, shade(base, 1.14));
    }
  }

  // 탱크 기준 좌표(앞쪽이 -y)를 바라보는 방향에 맞춰 세계 좌표로 옮긴다
  function localPts(t, list) {
    var f = t.dir, rx = -f.y, ry = f.x, out = [];
    for (var i = 0; i < list.length; i += 2) {
      var px = list[i], py = list[i + 1];
      out.push({ x: t.x + px * rx - py * f.x, y: t.y + px * ry - py * f.y });
    }
    return out;
  }

  function drawSegment(ax, ay, bx, by, color, width) {
    var p = clipNear([P(ax, ay, 0), P(bx, by, 0)]);
    if (p.length < 2) return;
    ctx.beginPath();
    for (var i = 0; i < 2; i++) {
      var sx = W / 2 + FOCAL * p[i].X / p[i].Z;
      var sy = HORIZON - FOCAL * p[i].Y / p[i].Z;
      if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.stroke();
  }

  var OCTA = (function () {
    // 팔각형 한 벌을 미리 뽑아 두고 포탑·큐폴라에 크기만 바꿔 쓴다
    var out = [];
    for (var i = 0; i < 8; i++) {
      var a = (i + 0.5) * Math.PI / 4;
      out.push(Math.cos(a), Math.sin(a));
    }
    return out;
  })();

  function octagon(t, cxLocal, cyLocal, radius) {
    var list = [];
    for (var i = 0; i < OCTA.length; i += 2) {
      list.push(cxLocal + OCTA[i] * radius, cyLocal + OCTA[i + 1] * radius);
    }
    return localPts(t, list);
  }

  function drawEnemy3D(t) {
    // 무한궤도 두 줄 — 어두운 궤도 위에 밝은 상부 주행부를 얹어 결을 낸다
    for (var side = -1; side <= 1; side += 2) {
      var x0 = Math.min(side * 8, side * 13.5), x1 = Math.max(side * 8, side * 13.5);
      drawPrism(localPts(t, [x0, -13.5, x1, -13.5, x1, 13.5, x0, 13.5]), 0, 10, C.track);
      drawPrism(localPts(t, [x0 + 1, -12, x1 - 1, -12, x1 - 1, 12, x0 + 1, 12]), 10, 11.5, C.wheel);
    }

    // 차체 — 앞이 좁고 비스듬한 경사 장갑
    drawPrism(localPts(t, [-6, -13.5, 6, -13.5, 8.5, -7, 8.5, 12, -8.5, 12, -8.5, -7]),
              4, 16, C.red);

    drawPrism(octagon(t, 0, 2, 8.5), 16, 25, C.red);        // 포탑
    drawPrism(octagon(t, 2.5, 6, 3.5), 25, 29, C.redDark);  // 큐폴라

    drawPrism(localPts(t, [-2.5, -30, 2.5, -30, 2.5, -5, -2.5, -5]), 18, 23, C.redDark);
    drawPrism(localPts(t, [-4, -34.5, 4, -34.5, 4, -29, -4, -29]), 17.5, 23.5, C.muzzle);
  }

  function drawGround3D() {
    // 하늘과 땅
    var sky = ctx.createLinearGradient(0, 0, 0, HORIZON);
    sky.addColorStop(0, '#6ea8d6');
    sky.addColorStop(1, '#b9d7e8');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, HORIZON);
    ctx.fillStyle = C.ground;
    ctx.fillRect(0, HORIZON, W, H - HORIZON);

    // 바닥 격자 — 움직이는 느낌을 주는 유일한 단서라 빠뜨릴 수 없다
    var cc = Math.round(cam.x / TILE), cr = Math.round(cam.y / TILE), R = 13;
    for (var i = -R; i <= R; i++) {
      var gx = (cc + i) * TILE, gy = (cr + i) * TILE;
      drawSegment(gx, (cr - R) * TILE, gx, (cr + R) * TILE, C.groundLine, 1);
      drawSegment((cc - R) * TILE, gy, (cc + R) * TILE, gy, C.groundLine, 1);
    }
  }

  // 조종수 앞을 가로지르는 내 포신과 해치 테두리
  function drawCockpit() {
    var cx = W / 2;

    // 포신은 조준선까지 올리지 않는다 — 정중앙이 가리면 적을 못 본다
    var tip = HORIZON + 76;

    function taper(halfBottom, halfTop, yTop, yBottom, fill, line) {
      ctx.beginPath();
      ctx.moveTo(cx - halfBottom, yBottom);
      ctx.lineTo(cx - halfTop, yTop);
      ctx.lineTo(cx + halfTop, yTop);
      ctx.lineTo(cx + halfBottom, yBottom);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.strokeStyle = C.outline;
      ctx.lineWidth = line;
      ctx.stroke();
    }

    taper(64, 17, tip + 54, H, C.blue, 3);          // 포방패
    taper(19, 9, tip, tip + 58, C.blueDark, 3);     // 포신
    taper(13, 11, tip + 16, tip + 26, C.blue, 2);   // 포신 띠
    taper(12, 11, tip - 1, tip + 9, C.muzzle, 2.5); // 포구제퇴기

    // 제퇴기 옆구멍
    ctx.fillStyle = C.outline;
    ctx.fillRect(cx - 11, tip + 2, 5, 4);
    ctx.fillRect(cx + 6, tip + 2, 5, 4);

    // 해치 — 바깥은 철판, 안쪽만 뚫려 있다
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    roundRectPath(FRAME, FRAME, W - FRAME * 2, H - FRAME * 2, 30);
    ctx.fillStyle = player.invuln > 0 ? '#4a2630' : '#1a1f26';
    ctx.fill('evenodd');
    ctx.strokeStyle = C.outline;
    ctx.lineWidth = 3;
    roundRect(FRAME, FRAME, W - FRAME * 2, H - FRAME * 2, 30);
    ctx.stroke();

    // 조준선
    ctx.strokeStyle = 'rgba(32, 38, 46, 0.75)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - 20, HORIZON); ctx.lineTo(cx - 7, HORIZON);
    ctx.moveTo(cx + 7, HORIZON);  ctx.lineTo(cx + 20, HORIZON);
    ctx.moveTo(cx, HORIZON - 20); ctx.lineTo(cx, HORIZON - 7);
    ctx.moveTo(cx, HORIZON + 7);  ctx.lineTo(cx, HORIZON + 20);
    ctx.stroke();
  }

  // 1인칭이라 내 위치를 잃기 쉬워 작은 지도를 같이 띄운다
  function drawMinimap() {
    var S = 5, mw = COLS * S, mh = ROWS * S;
    var mx = W - mw - FRAME - 12, my = H - mh - FRAME - 12;

    ctx.fillStyle = 'rgba(18, 22, 28, 0.78)';
    roundRect(mx - 5, my - 5, mw + 10, mh + 10, 6);
    ctx.fill();

    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var t = tiles[r][c];
        if (!t) continue;
        ctx.fillStyle = t === ROCK ? C.rock : t === FENCE ? C.wood : C.roof;
        ctx.fillRect(mx + c * S, my + r * S, S, S);
      }
    }

    ctx.fillStyle = C.red;
    for (var e = 0; e < enemies.length; e++) {
      ctx.fillRect(mx + enemies[e].x / TILE * S - 2, my + enemies[e].y / TILE * S - 2, 4, 4);
    }

    ctx.fillStyle = C.blue;
    ctx.fillRect(mx + player.x / TILE * S - 2.5, my + player.y / TILE * S - 2.5, 5, 5);
    ctx.fillRect(mx + (player.x + player.dir.x * 14) / TILE * S - 1.5,
                 my + (player.y + player.dir.y * 14) / TILE * S - 1.5, 3, 3);
  }

  function drawFirstPerson() {
    cam.x = player.x; cam.y = player.y;
    cam.fx = player.dir.x; cam.fy = player.dir.y;
    cam.rx = -cam.fy; cam.ry = cam.fx;

    drawGround3D();

    // 먼 것부터 그린다 — 겹치는 순서는 이 정렬 하나로 정해진다
    var items = [];
    function push(x, y, fn) {
      var dx = x - cam.x, dy = y - cam.y;
      items.push({ d: dx * dx + dy * dy, fn: fn });
    }

    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var t = tiles[r][c];
        if (!t) continue;
        (function (t, r, c) {
          var x = c * TILE, y = r * TILE;
          push(x + TILE / 2, y + TILE / 2, function () {
            if (t === FENCE) {
              drawBox(x + 3, y + 3, x + TILE - 3, y + TILE - 3, 0, HEIGHT.fence, C.wood);
              drawBox(x + 1, y + 1, x + TILE - 1, y + TILE - 1,
                      HEIGHT.fence, HEIGHT.fence + 3, C.woodDark);
            } else if (t === ROCK) {
              drawBox(x + 4, y + 4, x + TILE - 4, y + TILE - 4, 0, 18, C.rock);
              drawBox(x + 9, y + 9, x + TILE - 9, y + TILE - 9, 18, HEIGHT.rock, C.rockLight);
            } else if (t === HUT_HIT) {
              drawBox(x + 2, y + 2, x + TILE - 2, y + TILE - 2, 0, HEIGHT.rubble, C.roofDark);
            } else {
              drawBox(x, y, x + TILE, y + TILE, 0, 40, C.wall);
              drawBox(x - 1, y - 1, x + TILE + 1, y + TILE + 1, 40, HEIGHT.hut, C.roof);
            }
          });
        })(t, r, c);
      }
    }

    for (var e = 0; e < enemies.length; e++) {
      (function (t) { push(t.x, t.y, function () { drawEnemy3D(t); }); })(enemies[e]);
    }

    for (var b = 0; b < bullets.length; b++) {
      (function (s) {
        push(s.x, s.y, function () {
          drawBox(s.x - 3, s.y - 3, s.x + 3, s.y + 3, 11, 17, C.muzzle);
        });
      })(bullets[b]);
    }

    // 전장 밖 담벼락
    var FW = 60;
    push(W / 2, -FW, function () { drawBox(-FW, -FW, canvas.width + FW, 0, 0, HEIGHT.edge, C.rock); });
    push(W / 2, canvas.height + FW, function () { drawBox(-FW, canvas.height, canvas.width + FW, canvas.height + FW, 0, HEIGHT.edge, C.rock); });
    push(-FW, H / 2, function () { drawBox(-FW, 0, 0, canvas.height, 0, HEIGHT.edge, C.rock); });
    push(canvas.width + FW, H / 2, function () { drawBox(canvas.width, 0, canvas.width + FW, canvas.height, 0, HEIGHT.edge, C.rock); });

    items.sort(function (a, b) { return b.d - a.d; });
    for (var i = 0; i < items.length; i++) items[i].fn();

    drawCockpit();
    drawMinimap();
  }

  function drawTopDown() {
    drawGround();
    drawTiles();

    for (var e = 0; e < enemies.length; e++) drawTank(enemies[e]);

    // 무적 시간에는 깜빡여서 아직 안전하다는 걸 알린다
    if (player.invuln <= 0 || Math.floor(player.invuln / 150) % 2 === 0) drawTank(player);

    for (var b = 0; b < bullets.length; b++) drawBullet(bullets[b]);
  }

  function draw() {
    if (view === 'fpv') drawFirstPerson();
    else drawTopDown();
  }

  // ── 진행 ──────────────────────────────────────

  function update(dt) {
    player.reload = Math.max(0, player.reload - dt);
    player.invuln = Math.max(0, player.invuln - dt);

    var held = keys.up ? 'up' : keys.down ? 'down' : keys.left ? 'left' : keys.right ? 'right' : null;
    if (held) {
      face(player, held);
      moveTank(player, level.playerSpeed, dt);
    }
    if (keys.fire) fire(player, level.playerBullet);

    for (var i = 0; i < enemies.length; i++) {
      enemies[i].reload = Math.max(0, enemies[i].reload - dt);
      updateEnemy(enemies[i], dt);
    }

    trySpawn(dt);
    updateBullets(dt);
  }

  function loop(time) {
    if (state !== 'playing') return;
    if (!lastTime) lastTime = time;
    var dt = Math.min(time - lastTime, 50);   // 탭을 다시 열었을 때 한 번에 건너뛰지 않도록
    lastTime = time;

    update(dt);
    if (state !== 'playing') return;          // update 안에서 끝났으면 그 화면을 유지한다
    draw();
    requestAnimationFrame(loop);
  }

  // ── 화면 ──────────────────────────────────────

  function readBest() { return Number(localStorage.getItem(BEST_KEY + '.' + levelName) || 0); }

  function saveBest() {
    if (score > readBest()) {
      try { localStorage.setItem(BEST_KEY + '.' + levelName, String(score)); } catch (e) { /* 무시 */ }
    }
  }

  function setLevel(name) {
    levelName = LEVELS[name] ? name : 'easy';
    level = LEVELS[levelName];
    try { localStorage.setItem(LEVEL_KEY, levelName); } catch (e) { /* 무시 */ }
    // 시점 버튼도 .level 스타일을 함께 쓰므로 data-level 로 좁혀 잡는다
    Array.prototype.forEach.call(document.querySelectorAll('[data-level]'), function (btn) {
      var on = btn.dataset.level === levelName;
      btn.classList.toggle('is-on', on);
      btn.setAttribute('aria-pressed', String(on));
    });
  }

  function setView(name) {
    view = name === 'top' ? 'top' : 'fpv';
    try { localStorage.setItem(VIEW_KEY, view); } catch (e) { /* 무시 */ }
    Array.prototype.forEach.call(document.querySelectorAll('[data-view]'), function (btn) {
      var on = btn.dataset.view === view;
      btn.classList.toggle('is-on', on);
      btn.setAttribute('aria-pressed', String(on));
    });
  }

  function showOverlay(title, desc, buttonLabel, withLevels) {
    overlayTitle.textContent = title;
    overlayDesc.innerHTML = desc;
    startBtn.textContent = buttonLabel;
    levelsEl.hidden = !withLevels;
    viewsEl.hidden = false;   // 시점은 판을 초기화하지 않으니 일시정지 중에도 바꿀 수 있다
    overlay.hidden = false;
    startBtn.focus();
  }

  function readyScreen() {
    showOverlay(
      'Ready',
      '방향키로 움직이고 스페이스로 쏘세요.<br>' +
      '적 탱크 <b>' + level.total + '</b>대를 모두 부수면 이깁니다.<br>' +
      '담장과 막사는 부서지지만 바위는 못 뚫어요.',
      'Start', true);
  }

  function reset() {
    buildTiles();
    player = makeTank(8, 14, 'up', true);
    enemies = [];
    bullets = [];
    keys = {};
    score = 0;
    lives = level.lives;
    remaining = level.total;
    spawnQueue = level.total;
    spawnTimer = 0;
    spawnIndex = 0;
    scoreEl.textContent = score;
    lifeEl.textContent = lives;
    leftEl.textContent = remaining;
  }

  function start() {
    reset();
    state = 'playing';
    overlay.hidden = true;
    lastTime = 0;
    requestAnimationFrame(loop);
  }

  function gameOver() {
    state = 'over';
    saveBest();
    draw();
    showOverlay('Game Over',
      '탱크를 모두 잃었어요.<br>점수 <b>' + score + '</b> · 최고 <b>' + readBest() + '</b>',
      'Retry', true);
  }

  function win() {
    state = 'over';
    score += lives * 200;                      // 남은 목숨은 점수로 돌려준다
    scoreEl.textContent = score;
    saveBest();
    draw();
    showOverlay('Cleared',
      '적을 모두 물리쳤어요!<br>점수 <b>' + score + '</b> · 최고 <b>' + readBest() + '</b>',
      'Retry', true);
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      showOverlay('Paused', 'P 를 누르면<br>이어서 계속합니다.', 'Resume', false);
    } else if (state === 'paused') {
      state = 'playing';
      overlay.hidden = true;
      lastTime = 0;
      requestAnimationFrame(loop);
    }
  }

  // ── 입력 ──────────────────────────────────────

  var KEYS = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right'
  };

  document.addEventListener('keydown', function (e) {
    if (KEYS[e.key]) { e.preventDefault(); keys[KEYS[e.key]] = true; return; }
    if (e.key === ' ') {
      e.preventDefault();
      if (state === 'playing') keys.fire = true;
      else if (state !== 'paused') start();
      return;
    }
    if (e.key === 'p' || e.key === 'P') togglePause();
    if (e.key === 'r' || e.key === 'R') start();
  });

  document.addEventListener('keyup', function (e) {
    if (KEYS[e.key]) keys[KEYS[e.key]] = false;
    if (e.key === ' ') keys.fire = false;
  });

  // 터치/마우스 조작 — 누르고 있는 동안 유지되어야 해서 down/up 을 따로 잡는다
  function hold(el, prop) {
    function on(e) { e.preventDefault(); keys[prop] = true; }
    function off() { keys[prop] = false; }
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointerleave', off);
    el.addEventListener('pointercancel', off);
  }

  Array.prototype.forEach.call(document.querySelectorAll('.dpad button'), function (btn) {
    hold(btn, btn.dataset.dir);
  });
  hold(document.getElementById('fire-btn'), 'fire');

  Array.prototype.forEach.call(document.querySelectorAll('[data-view]'), function (btn) {
    btn.addEventListener('click', function () {
      setView(btn.dataset.view);
      draw();
    });
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-level]'), function (btn) {
    btn.addEventListener('click', function () {
      setLevel(btn.dataset.level);
      state = 'ready';
      reset();
      draw();
      readyScreen();
    });
  });

  startBtn.addEventListener('click', function () {
    if (state === 'paused') togglePause();
    else start();
  });

  // ── 첫 화면 — 기본은 쉬움 ─────────────────────
  state = 'ready';
  setView(localStorage.getItem(VIEW_KEY) || 'fpv');
  setLevel(localStorage.getItem(LEVEL_KEY) || 'easy');
  reset();
  draw();
  readyScreen();
})();
</script>
</body>
</html>
